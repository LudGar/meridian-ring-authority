  const L = LIV.G1, g = grp('G1_prime_dusk_line');
  mesh(g, 'fuselage', loft([{ z: -6.0, w: 1.3, h: 0.66, y: 1.0, e: 2.4 }, { z: -5.1, w: 1.8, h: 0.86, y: 1.0, e: 2.4 }, { z: -1.2, w: 1.6, h: 0.88, y: 1.0 }, { z: 2.8, w: 0.95, h: 0.6, y: 0.97 }, { z: 5.2, w: 0.32, h: 0.24, y: 0.93 }, { z: 6.0, w: 0.04, h: 0.04, y: 0.92 }]), L.p);
  mesh(g, 'dorsal_stripe', loft([{ z: -5.6, w: 0.3, h: 0.9, y: 1.03, e: 2.4 }, { z: 4.6, w: 0.16, h: 0.42, y: 0.97 }]), L.s);
  mesh(g, 'sealed_cockpit_visor', loft([{ z: 0.6, w: 0.62, h: 0.26, y: 1.38, e: 3, b: 0.2 }, { z: 1.8, w: 0.56, h: 0.22, y: 1.36, e: 3, b: 0.2 }, { z: 2.5, w: 0.3, h: 0.1, y: 1.3, e: 3, b: 0.2 }]), MAT.dark);
  box(g, 'visor_sensor_line', MAT.teal, -0.22, 0.22, 1.45, 1.48, 0.7, 2.1);
  for (const s of [1, -1]) {
    const w = mesh(g, 'delta_wing_' + (s > 0 ? 'R' : 'L'), plan([[0.7, 1.4], [1.75, -3.6], [1.75, -5.4], [0.7, -5.7]], 0.14), L.p, 0, 1.0, 0); w.scale.x = s;
    const st = mesh(g, 'wing_chevron_' + (s > 0 ? 'R' : 'L'), plan([[0.85, 0.4], [1.2, -1.3], [1.2, -1.75], [0.85, -0.05]], 0.145), L.s, 0, 1.0, 0); st.scale.x = s;
    mesh(g, 'tip_pod_' + (s > 0 ? 'R' : 'L'), loft([{ z: -5.7, w: 0.32, h: 0.34, y: 1.0, x: s * 1.86 }, { z: -3.4, w: 0.36, h: 0.38, y: 1.0, x: s * 1.86 }, { z: -2.2, w: 0.04, h: 0.04, y: 1.0, x: s * 1.86 }]), L.s);
    for (const [y, nm] of [[0.92, 'lift_emitter_down'], [1.08, 'lift_emitter_up']]) box(g, nm, MAT.teal, s * 1.0 - 0.3, s * 1.0 + 0.3, y - 0.012, y + 0.012, -4.6, -1.4);
    const c = mesh(g, 'canard_' + (s > 0 ? 'R' : 'L'), plan([[0.4, 3.6], [1.05, 2.9], [1.05, 2.65], [0.4, 2.8]], 0.05), L.s, 0, 0.95, 0); c.scale.x = s; c.rotation.z = s * -0.12;
    nozzle(g, 'side_thruster_' + (s > 0 ? 'R' : 'L'), 0.24, 0.38, s * 0.58, 0.98, -5.95);
  }
  box(g, 'belly_lift_emitter', MAT.teal, -0.4, 0.4, 0.55, 0.57, -4.8, 3.2); box(g, 'spine_lift_emitter', MAT.teal, -0.12, 0.12, 1.465, 1.48, -4.8, -2.6);
  mesh(g, 'dorsal_fin', fin([[-3.4, 1.3], [-2.4, 1.3], [-4.6, 2.3], [-5.6, 2.3]], 0.09), L.p);
  mesh(g, 'ventral_fin', fin([[-4.2, 0.72], [-3.6, 0.72], [-4.9, 0.42], [-5.5, 0.42]], 0.07), L.s);
  nozzle(g, 'main_thruster', 0.4, 0.5, 0, 1.0, -6.0);
  airbrake(g, L.s, 1.2, 1.07, -4.3, 0.75, 1.05);
  numbers(g, '1', '#e0612a', 0.8, 0.05, 1.85, -4.55);
  return g;
}

const CRAFT = [
  ['G-4', 'STREET', 'Spoke Couriers', G4, { len: '6.2 m', span: '2.5 m', top: '400 km/h', where: 'Spire-city circuits', build: 'Licensed civil hover chassis, the same frame as delivery skiffs. Four corner lift pods, twin ducted fans, glazed cab. Entry class.' }],
  ['G-3', 'SECTION', 'Terrace Works', G3, { len: '8.5 m', span: '6.1 m', top: '800 km/h', where: 'Open land, sea crossings, terraces', build: 'Open cockpit and ground-effect wings that ride the air cushion under them. The lift emitters sit in clamped modules under the wings and swap between heats.' }],
  ['G-2', 'TRUNK', 'Trunk Line Racing', G2, { len: '10.5 m', span: '3.9 m', top: '1,400 km/h', where: 'Trunk expressway, tunnels, Central GP', build: 'Enclosed canopy, twin-pod body, airbrakes on the pods. The energy cell on the spine recharges through pickup shoes from the track strip.' }],
  ['G-1', 'PRIME', 'Dusk Line', G1, { len: '12.0 m', span: '3.9 m', top: '2,400 km/h', where: 'Wall Ascent, Hull Circuit, Deep Caverns', build: 'Sealed for vacuum: no canopy, a sensor visor instead. Lift emitters top and bottom, so the field can push from either side on the outer faces and under the hull.' }],
];
const nav = document.getElementById('views'), opts = document.getElementById('opts'), note = document.getElementById('note');
const btn = (parent, html, fn) => { const b = document.createElement('button'); b.innerHTML = html; b.onclick = fn; parent.appendChild(b); return b; };
const hex = n => '#' + n.toString(16).padStart(6, '0');
CRAFT.forEach(([c, n, t], i) => btn(nav, '<span>' + c + '</span><span>' + n + ' · ' + t.toUpperCase() + '</span>', () => show(i)));
btn(nav, '<span>ALL</span><span>LINE-UP · SIDE BY SIDE</span>', () => show(4));
let open = false; const ab = [btn(opts, '<span>OFF</span><span>STOWED</span>', () => setBrakes(false)), btn(opts, '<span>ON</span><span>DEPLOYED</span>', () => setBrakes(true))];
let cur = 0;
const cache = {};
function build(i) {
  if (i < 4) return CRAFT[i][3]();
  const g = grp('grav_craft_lineup'); CRAFT.forEach((c, k) => { const m = c[3](); m.position.x = (k - 1.5) * 8.5; g.add(m); });
  box(g, 'scale_bar_2m', MAT.bone, -15, -13, 0, 0.04, 7.5, 7.62); return g;
}
function setBrakes(v) { open = v; for (const h of brakes) h.rotation.x = v ? h.userData.open : 0; ab.forEach((b, j) => b.setAttribute('aria-pressed', j === (v ? 1 : 0))); save(); }
function save() { localStorage.setItem('mra_grav_craft', JSON.stringify({ cur, open })); }
function show(i) {
  cur = i; cache[i] ??= build(i); stage.setAttribute('name', 'MRA-01_' + cache[i].name); stage.setObject(cache[i]); setBrakes(open);
  [...nav.querySelectorAll('button')].forEach((b, j) => b.setAttribute('aria-pressed', j === i));
  if (i === 4) { note.innerHTML = '<b>LINE-UP · G-4 → G-1</b>All four classes side by side at true scale, left to right G-4, G-3, G-2, G-1. The bar at front left is 2 m. Each craft wears one team\'s livery; teal is always lift, warm is always thrust, orange marks the airbrake edges and service points.'; return; }
  const [c, n, t, , s] = CRAFT[i], L = LIV['G' + c.slice(2)];
  note.innerHTML = '<b>' + c + ' ' + n + ' · ' + t.toUpperCase() + '</b>' + s.build + '<dl><dt>Length</dt><dd>' + s.len + '</dd><dt>Span</dt><dd>' + s.span + '</dd><dt>Top speed</dt><dd>' + s.top + '</dd><dt>Races</dt><dd>' + s.where + '</dd><dt>Livery</dt><dd>' + L.hex.map(h => '<span class="sw" style="background:' + hex(h) + '"></span>').join('') + '</dd></dl>';
}
await Promise.race([document.fonts.load("700 64px 'IBM Plex Sans Condensed'"), new Promise(r => setTimeout(r, 2500))]);
try { const s = JSON.parse(localStorage.getItem('mra_grav_craft') || '{}'); cur = Math.min(+s.cur || 0, 4); open = !!s.open; } catch (e) {}
show(cur);
</script>
