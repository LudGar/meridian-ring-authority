  { tag: 'UPPER', label: 'UPPER 140 m', title: 'Ring segment · Upper layers', text: 'A 240 × 120 m close cut through the top 140 m. A shaft kiosk on a plaza and a stair down to the L1 tram station (island platform, octagonal columns, two trams). L2 pipe galleries on three-tier racks: water in service blue, energy with teal bands, data trays, air ducts, orange rack tags. The 56 m L3 logistics hall with a gantry crane, container stacks and orange freight lanes. The lift shaft passes through every level.', fn: upperLayers },
  { tag: 'UPPER+', label: 'UPPER · NOTES', title: 'Ring segment · Upper layers, annotated', text: 'The upper-layer cutaway with callout boards at one line height (2.4 m, the size of the L1 label). Leaders point to the surface, L1 station, L2 galleries, L3 hall, the L5 slab and the lift shaft.', fn: () => { const r = upperLayers(); r.name += '_annotated'; notes(r, UPPER_NOTES, 2.4, 60.1); return r; } },
  { tag: 'WALL', label: 'RIM WALL DETAIL', title: 'Rim wall R-17 · Edge transition and wall foot', text: 'True-scale cut through the last 520 m before the rim and the bottom 600 m of the wall (it continues to 160 km). The brown steps are engineered terraces T1–T4: structural fill behind concrete retaining walls, aged copings, soil and grass on each tread, a service road and guardrail, orange edge signals. The wall: 60 m thick at the foot with a lift shaft, riser and galleries every 100 m. Its inner face carries 20 m panel bays, a P-03 thermal fin band, teal energy lanes, P-05 access doors, buttresses every 100 m, service ledges every 100 m and a glazed external elevator trunk. Lettering at one size (5 m line height).', fn: wallDetail },
  { tag: 'ROOT', label: 'WALL ROOT · L5–L6', title: 'Rim wall R-17 · Root, floor and outer shell', text: 'True-scale cut from the wall foot (+72 m) down to the exterior. [DD] Below the surface the wall becomes the rim keel: it flares from 60 m to 170 m and is built as hollow box-girder cells with X-bracing. The L5 ring floor ends in a joint gallery against the keel (orange seal line, inspection decks, lift) and is tied back by three galleries of orange tension tendons anchored inside the keel cells. The keel sits on a line of bone bearing pads over L6, where the rim main runs the length of the ring (water, energy, freight rail). The hull plate wraps the corner with a 45° chamfer and climbs the outer face of the wall; ribs, radiator fins, an outer elevator trunk and a docking platform sit on the exterior. Lettering at 10 m line height, as in the full-depth view.', fn: wallRoot },
];
const cache = {}, nav = document.getElementById('levels'), note = document.getElementById('note');
VIEWS.forEach((v, i) => { const b = document.createElement('button'); b.innerHTML = '<span>' + v.tag + '</span><span>' + v.label + '</span>'; b.onclick = () => show(i); nav.appendChild(b); });
function show(i) { const v = VIEWS[i]; cache[i] ??= v.fn(); stage.setAttribute('name', 'MRA-01_' + cache[i].name); stage.setObject(cache[i]); [...nav.children].forEach((b, j) => b.setAttribute('aria-pressed', j === i)); note.innerHTML = '<b>' + v.title + '</b>' + v.text; localStorage.setItem('mra_cutaway_view', i); }
await Promise.race([document.fonts.load("700 64px 'IBM Plex Sans Condensed'"), new Promise(r => setTimeout(r, 2500))]);
show(Math.min(+localStorage.getItem('mra_cutaway_view') || 0, VIEWS.length - 1));
