  const zf = Z1 + 0.1, LX = 64, LW = 50; BASE = 2.4;
  layerLabel(root, 'L1', ['L1 CIVIL · TRAM STATION'], LX, LW, -18, 6, zf);
  layerLabel(root, 'L2', ['L2 UTILITY · PIPE GALLERIES'], LX - 168, LW, -30.5, 3.5, zf);
  layerLabel(root, 'L3', ['L3 LOGISTICS HALL · 56 m'], LX - 180, LW, -86, 8, zf + 0.5);
  layerLabel(root, 'L5', ['L5 STRUCTURAL · CONTINUES 1.8 km'], LX - 180, LW, -132, 6, zf);
  return root;
}

const VIEWS = [
  { tag: 'FULL', label: 'FULL DEPTH', title: 'Ring segment · Full depth', text: 'A 1.6 × 0.6 km block cut across the ring at true scale, from the surface to the outer skin at −8 km. Surface: forest, straight transit track, lake over a pump station, city grid and the access spire. Below: L1 station halls and tram tunnels, L2 colour-coded galleries, L3 logistics halls with cranes, two 1.6 km caverns in L5 with L4 maintenance decks every 200 m, bridges and capacitor banks, the L6 core with an energy ring and computing rows. Then 6 km of hull structure with frame decks every kilometre, the ballast slab at −6 km (about 30 m here, in teal containment with orange hatches), the outer skin, and the exterior: ribs, radiator fins, transport trasses, an iris hatch and a tender. The spire shaft runs the full 8 km. The rim wall is in the Wall Standard model.', fn: fullDepth },
  { tag: 'FULL+', label: 'FULL · NOTES', title: 'Ring segment · Full depth, annotated', text: 'The full-depth cutaway with callout boards beside the section face. One line height throughout (10 m, the size of the L1 label), so every note reads at the same size. Orange leaders point to the layer each board describes.', fn: () => { const r = fullDepth(); r.name += '_annotated'; notes(r, FULL_NOTES, 10, 300.1); return r; } },
  { tag: 'UPPER', label: 'UPPER 140 m', title: 'Ring segment · Upper layers', text: 'A 240 × 120 m close cut through the top 140 m. A shaft kiosk on a plaza and a stair down to the L1 tram station (island platform, octagonal columns, two trams). L2 pipe galleries on three-tier racks: water in service blue, energy with teal bands, data trays, air ducts, orange rack tags. The 56 m L3 logistics hall with a gantry crane, container stacks and orange freight lanes. The lift shaft passes through every level.', fn: upperLayers },
  { tag: 'UPPER+', label: 'UPPER · NOTES', title: 'Ring segment · Upper layers, annotated', text: 'The upper-layer cutaway with callout boards at one line height (2.4 m, the size of the L1 label). Leaders point to the surface, L1 station, L2 galleries, L3 hall, the L5 slab and the lift shaft.', fn: () => { const r = upperLayers(); r.name += '_annotated'; notes(r, UPPER_NOTES, 2.4, 60.1); return r; } },
];
const cache = {}, nav = document.getElementById('levels'), note = document.getElementById('note');
VIEWS.forEach((v, i) => { const b = document.createElement('button'); b.innerHTML = '<span>' + v.tag + '</span><span>' + v.label + '</span>'; b.onclick = () => show(i); nav.appendChild(b); });
function show(i) { const v = VIEWS[i]; cache[i] ??= v.fn(); stage.setAttribute('name', 'MRA-01_' + cache[i].name); stage.setObject(cache[i]); [...nav.children].forEach((b, j) => b.setAttribute('aria-pressed', j === i)); note.innerHTML = '<b>' + v.title + '</b>' + v.text; localStorage.setItem('mra_cutaway_view', i); }
await Promise.race([document.fonts.load("700 64px 'IBM Plex Sans Condensed'"), new Promise(r => setTimeout(r, 2500))]);
show(Math.min(+localStorage.getItem('mra_cutaway_view') || 0, VIEWS.length - 1));
