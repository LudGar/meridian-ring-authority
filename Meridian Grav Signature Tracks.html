const TRACKS = [GR16, GR18, GR23, GR21];
const LABELS = [['GR-16', 'CENTRAL GP'], ['GR-18', 'WALL ASCENT'], ['GR-23', 'DEEP CAVERNS'], ['GR-21', 'HULL CIRCUIT']];
const cache = {}, nav = document.getElementById('views'), note = document.getElementById('note'), clsBox = document.getElementById('cls'), dirBox = document.getElementById('dir');
let cur = 0, cls = 'G-1', rev = false;
const btn = (parent, html, fn) => { const b = document.createElement('button'); b.innerHTML = html; b.onclick = fn; parent.appendChild(b); return b; };
LABELS.forEach(([c, l], i) => btn(nav, '<span>' + c + '</span><span>' + l + '</span>', () => show(i)));
Object.keys(SETS).forEach(k => btn(clsBox, k, () => { cls = k; refresh(); }));
btn(dirBox, 'FORWARD', () => { rev = false; refresh(); }); btn(dirBox, 'REVERSE', () => { rev = true; refresh(); });
function refresh() {
  const tr = cache[cur], rt = applyRoute(tr, cls, rev);
  [...nav.querySelectorAll('button')].forEach((b, j) => b.setAttribute('aria-pressed', j === cur));
  [...clsBox.children].forEach(b => b.setAttribute('aria-pressed', b.textContent === cls)); [...dirBox.children].forEach((b, j) => b.setAttribute('aria-pressed', j === (rev ? 1 : 0)));
  note.innerHTML = '<b>' + LABELS[cur][0] + ' · ' + LABELS[cur][1] + '</b>' + tr.T.text + ' Teal glow marks the selected route; orange cones show one-way direction.<span class="rt">' + rt + '</span>';
  localStorage.setItem('mra_grav_tracks', JSON.stringify({ cur, cls, rev }));
}
function show(i) { cur = i; cache[i] ??= buildTrack(TRACKS[i]); stage.setAttribute('name', 'MRA-01_' + cache[i].root.name); stage.setObject(cache[i].root); refresh(); }
await Promise.race([document.fonts.load("700 64px 'IBM Plex Sans Condensed'"), new Promise(r => setTimeout(r, 2500))]);
try { const s = JSON.parse(localStorage.getItem('mra_grav_tracks') || '{}'); if (SETS[s.cls]) cls = s.cls; rev = !!s.rev; cur = Math.min(+s.cur || 0, 3); } catch (e) {}
show(cur);
window.__buildAll = () => TRACKS.forEach((t, i) => { cache[i] ??= buildTrack(t); });
</script>
