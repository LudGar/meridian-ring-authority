<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

let seed = 0x17c2;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const M = (name, color, rough, metal, emissive, ei, opts = {}) => {
  const m = new THREE.MeshStandardMaterial({ name, color, roughness: rough, metalness: metal, ...opts });
  if (emissive) { m.emissive = new THREE.Color(emissive); m.emissiveIntensity = ei ?? 1; }
  return m;
};
const MAT = {
  bone:     M('ceramic_bone', 0xd9d3c6, 0.55, 0.05),
  aged:     M('ceramic_aged', 0xb3a68c, 0.8, 0.05),
  slate:    M('panel_slate', 0x6b7279, 0.6, 0.25),
  hull:     M('hull_graphite', 0x2b2f34, 0.72, 0.3),
  orange:   M('signal_orange', 0xe0612a, 0.5, 0.05),
  teal:     M('energy_teal', 0x3fd0c0, 0.3, 0, 0x3fd0c0, 1.4),
  blue:     M('water_service_blue', 0x3f6f9a, 0.45, 0.15),
  asphalt:  M('asphalt', 0x34373b, 0.95, 0),
  paver:    M('paver_stone', 0xa49f94, 0.9, 0),
  concrete: M('concrete_civil', 0x8e8a83, 0.92, 0),
  deep:     M('concrete_structural', 0x5b5953, 0.92, 0),
  soil:     M('soil_substrate', 0x5a4a3a, 1, 0),
  grass:    M('grass', 0x4f6b3c, 0.95, 0),
  foliage:  M('foliage', 0x3d5a36, 0.9, 0),
  bark:     M('bark', 0x4a3b2e, 0.95, 0),
  marking:  M('road_marking', 0xe8e4da, 0.7, 0),
  glass:    M('glass', 0x7fa2ae, 0.1, 0.2, null, 0, { transparent: true, opacity: 0.45 }),
  window:   M('window_dark', 0x26343b, 0.15, 0.3),
  warm:     M('light_warm', 0xf6e3b8, 0.5, 0, 0xf4cd88, 1.2),
  display:  M('display_screen', 0xcfe9e4, 0.3, 0, 0x9fe3d8, 0.9),
  rubber:   M('rubber_black', 0x1b1c1e, 0.9, 0),
};

// ---------- helpers
const root = new THREE.Group(); root.name = 'MRA01_surface_kit_C2';
const grp = (name, parent = root, x = 0, y = 0, z = 0, ry = 0) => { const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g; };
const mesh = (parent, name, geo, mat, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(geo, mat); m.name = name; m.position.set(x, y, z);
  m.castShadow = mat !== MAT.glass; m.receiveShadow = true; parent.add(m); return m;
};
// box by extents
const B = (parent, name, mat, x0, x1, y0, y1, z0, z1) =>
  ([x0, x1] = [Math.min(x0, x1), Math.max(x0, x1)], [z0, z1] = [Math.min(z0, z1), Math.max(z0, z1)], mesh(parent, name, new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2));
// chamfered prism (the Meridian corner: 45° chamfer), base at y
const chamGeo = (w, d, h, c) => {
  const s = new THREE.Shape(), x = w / 2, z = d / 2;
  s.moveTo(-x + c, -z); s.lineTo(x - c, -z); s.lineTo(x, -z + c); s.lineTo(x, z - c); s.lineTo(x - c, z); s.lineTo(-x + c, z); s.lineTo(-x, z - c); s.lineTo(-x, -z + c); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false }); g.rotateX(-Math.PI / 2); return g;
};
const C = (parent, name, mat, w, d, h, c, x, y, z) => mesh(parent, name, chamGeo(w, d, h, c), mat, x, y, z);
const cylX = (r, len, seg = 32) => { const g = new THREE.CylinderGeometry(r, r, len, seg); g.rotateZ(Math.PI / 2); return g; };

// ---------- L1–L4 ground section (x −32..32, z −22..22)
const X0 = -32, X1 = 32, Z0 = -22, Z1 = 22;
const ground = grp('L0-L4_ground_section');
// L4 structural ring plate
const l4 = grp('L4_structural', ground);
B(l4, 'L4_ring_plate', MAT.hull, X0, X1, -10.5, -9, Z0, Z1);
for (let x = -28; x <= 28; x += 8) B(l4, 'L4_ring_rib', MAT.slate, x - 0.4, x + 0.4, -10.6, -8.95, Z1 - 0.001, Z1 + 0.15);
B(l4, 'L4_access_grate_marking', MAT.orange, X1 - 0.02, X1 + 0.01, -10.2, -9.3, -4, 4);
// L2 utility gallery (void z −4..4, y −8.5..−5.5)
const l2 = grp('L2_utility_gallery', ground);
B(l2, 'L2_base_slab', MAT.deep, X0, X1, -9, -8.5, Z0, Z1);
B(l2, 'L2_fill_south', MAT.deep, X0, X1, -8.5, -5.5, Z0, -4);
B(l2, 'L2_fill_north', MAT.deep, X0, X1, -8.5, -5.5, 4, Z1);
B(l2, 'L1_floor_slab', MAT.deep, X0, X1, -5.5, -5, Z0, Z1);
mesh(l2, 'L2_pipe_water_main', cylX(0.6, 64), MAT.blue, 0, -7.6, -2.4);
mesh(l2, 'L2_pipe_energy_conduit', cylX(0.42, 64), MAT.hull, 0, -7.7, 0);
for (let x = -30; x <= 30; x += 6) mesh(l2, 'L2_energy_conduit_band', cylX(0.45, 0.25), MAT.teal, x, -7.7, 0);
mesh(l2, 'L2_pipe_data_trunk', cylX(0.28, 64), MAT.slate, 0, -6.4, 2.6);
mesh(l2, 'L2_pipe_wastewater', cylX(0.5, 64), MAT.aged, 0, -7.7, 2.6);
mesh(l2, 'L2_pipe_air_return', cylX(0.35, 64), MAT.bone, 0, -6.1, -2.6);
for (let x = -30; x <= 30; x += 4) B(l2, 'L2_pipe_rack', MAT.slate, x - 0.08, x + 0.08, -8.5, -5.5, -3.9, -3.75), B(l2, 'L2_pipe_rack', MAT.slate, x - 0.08, x + 0.08, -8.5, -5.5, 3.75, 3.9);
B(l2, 'L2_gallery_light_strip', MAT.warm, X0, X1, -5.62, -5.5, -0.15, 0.15);
// L1 service tunnel (void z −6..6, y −5..−1) + cross passage to shaft
const l1 = grp('L1_service_tunnel', ground);
B(l1, 'L1_wall_south', MAT.concrete, X0, X1, -5, -1, Z0, -6);
B(l1, 'L1_wall_north_main', MAT.concrete, X0, 28.5, -5, -1, 6, Z1);
B(l1, 'L1_wall_north_shaftside', MAT.concrete, 28.5, X1, -5, -1, 13.5, Z1);
B(l1, 'L1_passage_lintel', MAT.concrete, 28.5, X1, -2, -1, 6, 10);
B(l1, 'L1_tunnel_rail_left', MAT.slate, X0, X1, -5, -4.85, -1.6, -1.45);
B(l1, 'L1_tunnel_rail_right', MAT.slate, X0, X1, -5, -4.85, 1.45, 1.6);
B(l1, 'L1_walkway_south', MAT.paver, X0, X1, -5, -4.6, -6, -4.2);
B(l1, 'L1_walkway_north', MAT.paver, X0, X1, -5, -4.6, 4.2, 6);
B(l1, 'L1_walkway_edge_south', MAT.orange, X0, X1, -4.6, -4.58, -4.3, -4.2);
B(l1, 'L1_walkway_edge_north', MAT.orange, X0, X1, -4.6, -4.58, 4.2, 4.3);
B(l1, 'L1_ceiling_light_strip', MAT.warm, X0, X1, -1.12, -1.0, -0.2, 0.2);
B(l1, 'L1_wall_energy_strip_south', MAT.teal, X0, X1, -2.4, -2.3, -5.99, -5.95);
B(l1, 'L1_wall_energy_strip_north', MAT.teal, X0, 28.5, -2.4, -2.3, 5.95, 5.99);
for (let x = -30; x <= 26; x += 7) { B(l1, 'L1_wall_cable_tray', MAT.slate, x, x + 5, -3.4, -3.25, -5.99, -5.6); B(l1, 'L1_wall_cable_tray', MAT.slate, x, x + 5, -3.4, -3.25, 5.6, 5.99); }
// maintenance rail vehicle (M-crawler) in tunnel
{
  const v = grp('vehicle_tunnel_maintenance_crawler', l1, -10, -4.85, 0);
  C(v, 'crawler_body', MAT.orange, 5.2, 2.6, 1.6, 0.35, 0, 0.3, 0);
  B(v, 'crawler_roof_module', MAT.slate, -1.8, 1.2, 1.9, 2.3, -0.9, 0.9);
  B(v, 'crawler_window', MAT.window, 2.35, 2.62, 1.0, 1.6, -1.0, 1.0);
  B(v, 'crawler_headlight', MAT.warm, 2.6, 2.63, 0.55, 0.7, -1.0, 1.0);
  for (const x of [-1.8, 1.8]) for (const z of [-1.52, 1.52]) mesh(v, 'crawler_wheel', new THREE.CylinderGeometry(0.3, 0.3, 0.2, 24).rotateX(Math.PI / 2), MAT.rubber, x, 0.3, z);
  B(v, 'crawler_beacon', MAT.teal, -0.3, 0.3, 2.3, 2.45, -0.15, 0.15);
}
// inspection robot on north walkway
{
  const r = grp('robot_inspection_R1', l1, 14, -4.6, 5.1);
  C(r, 'robot_body', MAT.bone, 0.9, 0.7, 0.6, 0.15, 0, 0.25, 0);
  B(r, 'robot_band', MAT.orange, -0.46, 0.46, 0.55, 0.62, -0.36, 0.36);
  mesh(r, 'robot_sensor_mast', new THREE.CylinderGeometry(0.05, 0.05, 0.6, 12), MAT.slate, 0, 1.15, 0);
  mesh(r, 'robot_sensor_head', new THREE.SphereGeometry(0.12, 20, 12), MAT.teal, 0, 1.5, 0);
  for (const x of [-0.3, 0.3]) mesh(r, 'robot_wheel', new THREE.CylinderGeometry(0.13, 0.13, 0.12, 20).rotateX(Math.PI / 2), MAT.rubber, x, 0.13, 0.38), mesh(r, 'robot_wheel', new THREE.CylinderGeometry(0.13, 0.13, 0.12, 20).rotateX(Math.PI / 2), MAT.rubber, x, 0.13, -0.38);
}
// L0 crust (soil + surface slab) with shaft opening x 28.5..32, z 10..13.5
const crust = grp('L0_crust', ground);
const crustPieces = [[X0, 28.5, Z0, Z1], [28.5, X1, Z0, 10], [28.5, X1, 13.5, Z1]];
for (const [a, b, c, d] of crustPieces) { B(crust, 'L0_tunnel_roof_slab', MAT.concrete, a, b, -1, -0.6, c, d); B(crust, 'L0_soil_substrate', MAT.soil, a, b, -0.6, -0.02, c, d); }
// shaft (open to the x=+32 cutaway face)
{
  const sh = grp('access_shaft_S17', ground);
  B(sh, 'shaft_lift_cage', MAT.slate, 29.4, 31.2, -4.9, -2.4, 10.6, 12.9);
  B(sh, 'shaft_lift_cage_door', MAT.orange, 29.4, 31.2, -4.9, -2.4, 10.58, 10.6);
  for (const z of [10.05, 13.45]) B(sh, 'shaft_guide_rail', MAT.hull, 30.2, 30.4, -5, 0, z - 0.05, z + 0.05);
  B(sh, 'shaft_rim_marking', MAT.orange, 28.5, 28.6, -1, 0, 10, 13.5);
  B(sh, 'shaft_ladder_rail', MAT.bone, 28.55, 28.62, -5, 0, 12.6, 12.68);
  B(sh, 'shaft_ladder_rail', MAT.bone, 28.55, 28.62, -5, 0, 13.1, 13.18);
  for (let y = -4.8; y < 0; y += 0.35) B(sh, 'shaft_ladder_rung', MAT.bone, 28.55, 28.62, y, y + 0.04, 12.6, 13.18);
}

// ---------- L0 surface: road, sidewalks, plazas
const surf = grp('L0_surface');
B(surf, 'road_asphalt', MAT.asphalt, X0, X1, -0.02, 0.04, -5, 5);
for (let x = -30; x < 30; x += 6) B(surf, 'road_lane_dash', MAT.marking, x, x + 3, 0.04, 0.045, -0.08, 0.08);
B(surf, 'road_edge_line', MAT.marking, X0, X1, 0.04, 0.045, -4.6, -4.45);
B(surf, 'road_edge_line', MAT.marking, X0, X1, 0.04, 0.045, 4.45, 4.6);
B(surf, 'road_service_lane_marking', MAT.orange, X0, X1, 0.04, 0.045, -3.0, -2.9); // maintenance priority lane edge
for (let z = -4.2; z < 4.2; z += 1.0) B(surf, 'road_crossing_bar', MAT.marking, 6, 9, 0.04, 0.046, z, z + 0.55);
for (const z of [-5.15, 5.15]) B(surf, 'curb', MAT.concrete, X0, X1, -0.02, 0.18, z - 0.15, z + 0.15);
B(surf, 'sidewalk_south', MAT.paver, X0, X1, -0.02, 0.15, -9.5, -5.3);
B(surf, 'sidewalk_north', MAT.paver, X0, X1, -0.02, 0.15, 5.3, 9.5);
for (let x = -31; x < 32; x += 4) { B(surf, 'sidewalk_joint', MAT.concrete, x, x + 0.06, 0.15, 0.152, -9.5, -5.3); B(surf, 'sidewalk_joint', MAT.concrete, x, x + 0.06, 0.15, 0.152, 5.3, 9.5); }
// service corridor line inlay (marks L1 tunnel below)
B(surf, 'sidewalk_service_inlay', MAT.slate, X0, X1, 0.15, 0.154, 8.6, 8.9);
B(surf, 'plaza_south', MAT.paver, X0, X1, -0.02, 0.1, Z0, -9.5);
B(surf, 'plaza_north_a', MAT.paver, X0, 28.5, -0.02, 0.1, 9.5, Z1);
B(surf, 'plaza_north_b', MAT.paver, 28.5, X1, -0.02, 0.1, 13.5, Z1);
B(surf, 'plaza_north_c', MAT.paver, 28.5, X1, -0.02, 0.1, 9.5, 10);
// lawns (geometric)
for (const [a, b, c, d] of [[-30, -22, -21, -16], [22, 30, -21, -13], [-4, 0, 11, 21], [10, 26, 11, 17]]) B(surf, 'lawn', MAT.grass, a, b, 0.1, 0.16, c, d);
// manholes
const manhole = (x, z, y = 0.04) => {
  const g = grp('access_hatch_round', surf, x, y, z);
  mesh(g, 'hatch_lid', new THREE.CylinderGeometry(0.6, 0.6, 0.03, 40), MAT.hull, 0, 0.015, 0);
  const t = new THREE.TorusGeometry(0.62, 0.05, 8, 40); t.rotateX(Math.PI / 2); mesh(g, 'hatch_ring', t, MAT.orange, 0, 0.03, 0);
  B(g, 'hatch_grip', MAT.slate, -0.25, 0.25, 0.03, 0.05, -0.04, 0.04);
};
manhole(-18, -3.8); manhole(2, 3.8); manhole(20, -3.8); manhole(-6, 7.4, 0.15);
// road maintenance hatch (rectangular, flush)
B(surf, 'road_service_hatch', MAT.hull, -26, -22, 0.04, 0.055, -2.8, -0.4);
B(surf, 'road_service_hatch_frame', MAT.orange, -26.1, -21.9, 0.04, 0.05, -2.9, -0.3);

// ---------- street furniture family
const fur = grp('street_furniture');
const lamp = (x, z, side) => {
  const g = grp('street_lamp_L' + String(Math.round(x + 40)).padStart(2, '0'), fur, x, 0.15, z);
  C(g, 'lamp_footing', MAT.concrete, 0.55, 0.55, 0.35, 0.12, 0, 0, 0);
  C(g, 'lamp_energy_ring', MAT.teal, 0.42, 0.42, 0.06, 0.1, 0, 0.35, 0);
  C(g, 'lamp_post', MAT.slate, 0.24, 0.24, 7.2, 0.06, 0, 0.41, 0);
  B(g, 'lamp_id_plate', MAT.orange, -0.1, 0.1, 2.3, 2.7, side * -0.125, side * -0.135 + (side > 0 ? 0 : 0));
  B(g, 'lamp_service_door', MAT.hull, -0.08, 0.08, 0.7, 1.4, side * 0.12, side * 0.125);
  B(g, 'lamp_arm', MAT.bone, -0.12, 0.12, 7.45, 7.65, side < 0 ? 0 : -2.6, side < 0 ? 2.6 : 0);
  B(g, 'lamp_luminaire_housing', MAT.bone, -0.18, 0.18, 7.35, 7.48, side < 0 ? 0.6 : -2.5, side < 0 ? 2.5 : -0.6);
  B(g, 'lamp_luminaire_emitter', MAT.warm, -0.13, 0.13, 7.33, 7.35, side < 0 ? 0.7 : -2.4, side < 0 ? 2.4 : -0.7);
  B(g, 'lamp_cap', MAT.bone, -0.14, 0.14, 7.61, 7.7, -0.14, 0.14);
};
for (const x of [-26, -12, 2, 16]) lamp(x, -8.7, -1);
for (const x of [-19, -5, 23]) lamp(x, 8.7, 1);
// bollards
for (let x = 4; x <= 11; x += 1.5) for (const z of [-5.7, 5.7]) { const g = grp('bollard', fur, x, 0.15, z); C(g, 'bollard_body', MAT.bone, 0.22, 0.22, 0.9, 0.06, 0, 0, 0); B(g, 'bollard_band', MAT.orange, -0.112, 0.112, 0.7, 0.76, -0.112, 0.112); }
// transit stop
{
