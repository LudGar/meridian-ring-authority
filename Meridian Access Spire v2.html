<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

let seed = 0xA517;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rnd() * a.length)];
const TAU = Math.PI * 2;

const M = (name, color, rough, metal, emissive, ei, opts = {}) => {
  const m = new THREE.MeshStandardMaterial({ name, color, roughness: rough, metalness: metal, ...opts });
  if (emissive) { m.emissive = new THREE.Color(emissive); m.emissiveIntensity = ei ?? 1; }
  return m;
};
const MAT = {
  bone: M('ceramic_bone', 0xd9d3c6, 0.55, 0.05),
  aged: M('ceramic_aged', 0xb3a68c, 0.8, 0.05),
  slate: M('panel_slate', 0x6b7279, 0.6, 0.25),
  hull: M('hull_graphite', 0x2b2f34, 0.72, 0.3),
  mass: M('structural_mass', 0x44484d, 0.8, 0.25),
  thermal: M('radiator_graphite', 0x3a3f45, 0.45, 0.35),
  orange: M('signal_orange', 0xe0612a, 0.5, 0.05),
  teal: M('energy_teal', 0x3fd0c0, 0.3, 0, 0x3fd0c0, 1.5),
  blue: M('water_service_blue', 0x3f6f9a, 0.45, 0.15),
  paver: M('paver_stone', 0xa49f94, 0.9, 0),
  concrete: M('concrete_civil', 0x8e8a83, 0.92, 0),
  deep: M('concrete_structural', 0x5b5953, 0.92, 0),
  soil: M('soil_substrate', 0x5a4a3a, 1, 0),
  grass: M('grass', 0x4f6b3c, 0.95, 0),
  foliage: M('foliage', 0x3d5a36, 0.9, 0),
  glass: M('glass', 0x7fa2ae, 0.1, 0.2, null, 0, { transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }),
  window: M('window_dark', 0x26343b, 0.15, 0.3),
  warm: M('light_warm', 0xf6e3b8, 0.5, 0, 0xf4cd88, 1.2),
  display: M('display_screen', 0xcfe9e4, 0.3, 0, 0x9fe3d8, 0.9),
  rubber: M('rubber_black', 0x1b1c1e, 0.9, 0),
};

// ---------- helpers
let root;
const grp = (name, parent = root, x = 0, y = 0, z = 0, ry = 0) => { const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g; };
const mesh = (p, name, geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.name = name; m.position.set(x, y, z); p.add(m); return m; };
const B = (p, name, mat, x0, x1, y0, y1, z0, z1) => mesh(p, name, new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)), mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
const oct = (p, name, mat, rb, rt, y0, y1) => { const g = new THREE.CylinderGeometry(rt, rb, y1 - y0, 8); g.rotateY(Math.PI / 8); return mesh(p, name, g, mat, 0, (y0 + y1) / 2, 0); };
const octRing = (p, name, mat, r, tube, y) => { const t = new THREE.TorusGeometry(r, tube, 6, 8); t.rotateZ(Math.PI / 8); t.rotateX(Math.PI / 2); return mesh(p, name, t, mat, 0, y, 0); };
const ring = (p, name, mat, r, tube, y, seg = 48) => { const t = new THREE.TorusGeometry(r, tube, 8, seg); t.rotateX(Math.PI / 2); return mesh(p, name, t, mat, 0, y, 0); };
const cylX = (r, len, seg = 24) => new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2);
const AP = Math.cos(Math.PI / 8);
const faceAt = (p, a, dist, y, fn) => { const g = grp('face', p, Math.sin(a) * dist, y, Math.cos(a) * dist, a); fn(g); return g; };
const cham = (w, d, h, c) => { const s = new THREE.Shape(), x = w / 2, z = d / 2; s.moveTo(-x + c, -z); s.lineTo(x - c, -z); s.lineTo(x, -z + c); s.lineTo(x, z - c); s.lineTo(x - c, z); s.lineTo(-x + c, z); s.lineTo(-x, z - c); s.lineTo(-x, -z + c); s.closePath(); const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false }); g.rotateX(-Math.PI / 2); return g; };
const C = (p, name, mat, w, d, h, c, x, y, z) => mesh(p, name, cham(w, d, h, c), mat, x, y, z);

// batch: merge many boxes per (name, material) into one mesh
function batch(parent) {
  const map = new Map();
  return {
    box(name, mat, x0, x1, y0, y1, z0, z1) { const g = new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)); g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); this.geo(name, mat, g); },
    geo(name, mat, g) { const k = name + '|' + mat.name; if (!map.has(k)) map.set(k, { name, mat, list: [] }); map.get(k).list.push(g); },
    flush() {
      for (const { name, mat, list } of map.values()) {
        const pos = [], nor = [], uv = [], idx = []; let off = 0;
        for (const g of list) { const p = g.attributes.position; pos.push(...p.array); nor.push(...g.attributes.normal.array); uv.push(...g.attributes.uv.array); for (const i of g.index.array) idx.push(i + off); off += p.count; g.dispose(); }
        const b = new THREE.BufferGeometry();
        b.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); b.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); b.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); b.setIndex(idx);
        mesh(parent, name, b, mat);
      }
    },
  };
}
// 1.8 m figure for scale
const person = (p, x, y, z, mat = MAT.bone) => { const g = grp('figure', p, x, y, z); mesh(g, 'figure_body', new THREE.CylinderGeometry(0.22, 0.2, 1.4, 8), mat, 0, 0.7, 0); mesh(g, 'figure_head', new THREE.SphereGeometry(0.15, 10, 8), MAT.bone, 0, 1.62, 0); return g; };
const rail = (p, name, x0, x1, y, z, post = 2) => { B(p, name + '_top', MAT.bone, x0, x1, y + 1.0, y + 1.1, z - 0.04, z + 0.04); B(p, name + '_mid', MAT.slate, x0, x1, y + 0.5, y + 0.56, z - 0.03, z + 0.03); for (let x = x0; x <= x1 + 0.01; x += post) B(p, name + '_post', MAT.slate, x - 0.04, x + 0.04, y, y + 1.1, z - 0.04, z + 0.04); };
const zigShape = (x0, x1, yFlat, yZig, amp, step, zigTop) => { const s = new THREE.Shape(); s.moveTo(x0, yFlat); s.lineTo(x1, yFlat); let i = 0; for (let x = x1; x >= x0 - 0.01; x -= step / 2) s.lineTo(x, yZig + (i++ % 2 ? amp : -amp) * (zigTop ? 1 : 1)); s.closePath(); return s; };

// ================= SPIRE (unchanged design from v1, above grade)
function buildSpire() {
  const plaza = grp('plaza_level_0');
  oct(plaza, 'plaza_paving', MAT.paver, 42, 42, -0.4, 0);
  oct(plaza, 'plaza_inner_ring', MAT.bone, 24, 24, 0, 0.12);
  octRing(plaza, 'plaza_signal_inlay', MAT.orange, 24.3, 0.18, 0.08);
  octRing(plaza, 'plaza_energy_inlay', MAT.teal, 34, 0.1, 0.02);
  for (let k = 0; k < 8; k++) faceAt(plaza, k * Math.PI / 4 + Math.PI / 8, 33, 0, g => { B(g, 'lawn_wedge', MAT.grass, -5, 5, 0, 0.18, -3, 3); B(g, 'lawn_curb', MAT.bone, -5.2, 5.2, 0, 0.35, -3.2, -3); });
  for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8, g = grp('bollard', plaza, Math.sin(a) * 26, 0.12, Math.cos(a) * 26); mesh(g, 'bollard_body', new THREE.CylinderGeometry(0.15, 0.15, 0.95, 8), MAT.bone, 0, 0.475, 0); mesh(g, 'bollard_band', new THREE.CylinderGeometry(0.155, 0.155, 0.08, 8), MAT.orange, 0, 0.78, 0); }
  for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + Math.PI / 4, g = grp('plaza_light_mast', plaza, Math.sin(a) * 30, 0, Math.cos(a) * 30); oct(g, 'mast_footing', MAT.concrete, 0.6, 0.5, 0, 0.5); oct(g, 'mast_post', MAT.slate, 0.22, 0.14, 0.5, 11); oct(g, 'mast_luminaire', MAT.warm, 0.7, 0.5, 11, 11.3); oct(g, 'mast_cap', MAT.bone, 0.75, 0.3, 11.3, 11.6); }
  const pod = grp('podium');
  oct(pod, 'podium_plinth', MAT.concrete, 17.5, 17.2, 0, 0.6); oct(pod, 'podium_body', MAT.bone, 16, 15, 0.6, 8); oct(pod, 'podium_canopy', MAT.bone, 20, 19.5, 8, 8.9);
  octRing(pod, 'podium_canopy_light', MAT.warm, 19.4, 0.12, 7.95); octRing(pod, 'podium_canopy_energy', MAT.teal, 19.8, 0.1, 8.9);
  for (let k = 0; k < 8; k++) faceAt(pod, k * Math.PI / 4, 15.5 * AP + 0.02, 0, g => {
    if (k % 2 === 0) { B(g, 'portal_recess', MAT.window, -2.8, 2.8, 0.6, 5.6, -0.02, 0.05); B(g, 'portal_glow', MAT.warm, -2.6, 2.6, 5.2, 5.4, 0.04, 0.07); B(g, 'portal_frame_l', MAT.orange, -3.2, -2.8, 0.6, 6.0, -0.02, 0.12); B(g, 'portal_frame_r', MAT.orange, 2.8, 3.2, 0.6, 6.0, -0.02, 0.12); B(g, 'portal_lintel', MAT.orange, -3.2, 3.2, 5.6, 6.0, -0.02, 0.12); B(g, 'portal_door_seam', MAT.slate, -0.04, 0.04, 0.6, 5.2, 0.05, 0.07); B(g, 'portal_steps', MAT.concrete, -3.6, 3.6, 0, 0.6, 0, 2.2); B(g, 'portal_id_plate', MAT.hull, 3.6, 5.4, 4.0, 4.8, -0.02, 0.04); }
    else for (let i = -2; i <= 2; i++) B(g, 'podium_slot_window', MAT.window, i * 1.3 - 0.35, i * 1.3 + 0.35, 1.6, 6.4, -0.02, 0.03);
  });
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + Math.PI / 8, s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(6, 0); s.lineTo(0, 22); s.closePath(); const g = new THREE.ExtrudeGeometry(s, { depth: 0.6, bevelEnabled: false }); g.translate(0, 0, -0.3); const f = mesh(pod, 'buttress_fin', g, MAT.bone, Math.sin(a) * 14.8, 8.9, Math.cos(a) * 14.8); f.rotation.y = a - Math.PI / 2; }
  const shaft = grp('spire_lower_shaft'), segs = 7, y0 = 8.9, y1 = 96, r0 = 10, r1 = 6.2;
  for (let i = 0; i < segs; i++) {
    const ya = y0 + (y1 - y0) * i / segs, yb = y0 + (y1 - y0) * (i + 1) / segs, ra = r0 + (r1 - r0) * i / segs, rb = r0 + (r1 - r0) * (i + 1) / segs;
    oct(shaft, 'shaft_segment_' + i, MAT.bone, ra, rb, ya, yb - 0.7);
    oct(shaft, i % 3 === 2 ? 'shaft_band_signal' : 'shaft_band_slate', i % 3 === 2 ? MAT.orange : MAT.slate, rb + 0.15, rb + 0.15, yb - 0.7, yb);
    for (let k = 0; k < 4; k++) faceAt(shaft, k * Math.PI / 2 + Math.PI / 4, (ra + rb) / 2 * AP + 0.03, (ya + yb) / 2, g => { B(g, 'shaft_energy_rail', MAT.teal, -0.12, 0.12, -(yb - ya) / 2, (yb - ya) / 2 - 0.7, 0, 0.08); for (const x of [-1.4, 1.4]) B(g, 'shaft_slit_window', MAT.window, x - 0.25, x + 0.25, -4, 3.5, -0.03, 0.03); });
  }
  const tubes = grp('lift_tubes'), tubeR = 1.8, tubeTop = 98;
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2, d = r0 * AP + tubeR + 0.6, g = grp('lift_tube_' + 'NESW'[k], tubes, Math.sin(a) * d, 0, Math.cos(a) * d);
    mesh(g, 'tube_glass', new THREE.CylinderGeometry(tubeR, tubeR, tubeTop - 8.9, 24, 1, true), MAT.glass, 0, (tubeTop + 8.9) / 2, 0);
    for (let y = 12; y < tubeTop; y += 6) ring(g, 'tube_ring', MAT.slate, tubeR + 0.05, 0.1, y, 24);
    for (const s of [-1, 1]) B(g, 'tube_guide_rail', MAT.hull, s * 1.2 - 0.08, s * 1.2 + 0.08, 8.9, tubeTop, -0.08, 0.08);
    for (let i = 1; i <= segs; i++) { const yb = y0 + (y1 - y0) * i / segs, rb = r0 + (r1 - r0) * i / segs, gap = d - tubeR - rb * AP; if (gap > 0.2) { const br = mesh(g, 'tube_brace', new THREE.BoxGeometry(0.6, 0.5, gap), MAT.slate, Math.sin(a) * -(tubeR + gap / 2), yb - 0.35, Math.cos(a) * -(tubeR + gap / 2)); br.rotation.y = a; } }
    const cab = grp('lift_cab', g, 0, [22, 61, 40, 80][k], 0, a);
    mesh(cab, 'cab_shell', new THREE.CylinderGeometry(1.5, 1.5, 3.2, 20), MAT.bone); B(cab, 'cab_window', MAT.warm, -0.9, 0.9, -0.9, 1.0, 1.25, 1.52);
    mesh(cab, 'cab_roof_band', new THREE.CylinderGeometry(1.55, 1.55, 0.25, 20), MAT.orange, 0, 1.7, 0); mesh(cab, 'cab_floor_band', new THREE.CylinderGeometry(1.55, 1.55, 0.2, 20), MAT.teal, 0, -1.7, 0);
  }
  const sky = grp('sky_lobby_transfer');
  oct(sky, 'sky_floor_slab', MAT.bone, 14.5, 15, 96, 97.2); oct(sky, 'sky_glazing', MAT.glass, 14.2, 14.2, 97.2, 102.4); oct(sky, 'sky_core', MAT.slate, 6.4, 6.4, 97.2, 102.4); oct(sky, 'sky_interior_light', MAT.warm, 13.8, 13.8, 102.2, 102.4);
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + Math.PI / 8; mesh(sky, 'sky_mullion', new THREE.BoxGeometry(0.3, 5.2, 0.3), MAT.slate, Math.sin(a) * 14.2, 99.8, Math.cos(a) * 14.2); }
  oct(sky, 'sky_roof_slab', MAT.bone, 15, 13, 102.4, 104); octRing(sky, 'sky_signal_edge', MAT.orange, 15.1, 0.25, 96.6); octRing(sky, 'sky_energy_edge', MAT.teal, 13.6, 0.12, 104);
  for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + Math.PI / 4, r = mesh(sky, 'sky_radiator_vane', new THREE.BoxGeometry(0.15, 3, 5), MAT.thermal, Math.sin(a) * 9, 105.6, Math.cos(a) * 9); r.rotation.y = a; }
  const up = grp('spire_upper'), u0 = 104, u1 = 140, ur0 = 6, ur1 = 3;
  for (let i = 0; i < 4; i++) {
    const ya = u0 + (u1 - u0) * i / 4, yb = u0 + (u1 - u0) * (i + 1) / 4, ra = ur0 + (ur1 - ur0) * i / 4, rb = ur0 + (ur1 - ur0) * (i + 1) / 4;
    oct(up, 'upper_segment_' + i, MAT.bone, ra, rb, ya, yb - 0.5); oct(up, 'upper_band', MAT.slate, rb + 0.1, rb + 0.1, yb - 0.5, yb);
    for (let k = 0; k < 4; k++) faceAt(up, k * Math.PI / 2 + Math.PI / 4, (ra + rb) / 2 * AP + 0.03, (ya + yb) / 2, g => B(g, 'upper_energy_rail', MAT.teal, -0.1, 0.1, -(yb - ya) / 2, (yb - ya) / 2 - 0.5, 0, 0.06));
  }
  const crown = grp('crown');
  oct(crown, 'crown_signal_band', MAT.orange, 3.4, 3.4, 140, 142.5); oct(crown, 'crown_plant_deck', MAT.slate, 4.4, 4.4, 142.5, 143.3); oct(crown, 'crown_cap', MAT.bone, 3, 1.6, 143.3, 148);
  for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2, d = mesh(crown, 'crown_comm_dish', new THREE.CylinderGeometry(0.9, 0.25, 0.35, 20), MAT.bone, Math.sin(a) * 3.3, 144.6, Math.cos(a) * 3.3); d.rotation.order = 'YXZ'; d.rotation.x = Math.PI / 2; d.rotation.y = a; }
  mesh(crown, 'needle_mast', new THREE.CylinderGeometry(0.12, 0.45, 24, 8), MAT.slate, 0, 160, 0);
  for (const [y, r] of [[152, 1.4], [158, 1.0], [164, 0.7]]) ring(crown, 'needle_halo', MAT.teal, r, 0.07, y, 32);
  mesh(crown, 'beacon', new THREE.SphereGeometry(0.5, 20, 14), MAT.teal, 0, 172.3, 0); mesh(crown, 'beacon_cap', new THREE.CylinderGeometry(0.2, 0.2, 0.4, 12), MAT.orange, 0, 171.7, 0);
}

// iris hatch + clamps + craft (exterior), origin at hatch plane
function buildHatch(parent, aperture = 3.5, withCraft = true) {
  const h = grp('exterior_iris_hatch', parent);

// ================= VIEW 5: HULL HATCH CHAMBER (−2 000 m)
function buildHatchChamber() {
  root = new THREE.Group(); root.name = 'L5_hull_hatch_chamber_diorama';
  const bt = batch(root), R = 22, Hc = 30;
  // floor with hatch opening
  const fs = new THREE.Shape(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + Math.PI / 8; k ? fs.lineTo(Math.sin(a) * R / AP, Math.cos(a) * R / AP) : fs.moveTo(Math.sin(a) * R / AP, Math.cos(a) * R / AP); }
  const hole = new THREE.Path(); hole.absarc(0, 0, 12.3, 0, TAU, true); fs.holes.push(hole);

  ring(root, 'floor_signal_ring', MAT.orange, 13.2, 0.3, 0.05); ring(root, 'floor_energy_ring', MAT.teal, 15.5, 0.12, 0.02, 64);
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; const s = mesh(root, 'floor_hazard_chevron', new THREE.BoxGeometry(2.4, 0.05, 0.6), MAT.orange, Math.sin(a) * 18, 0.03, Math.cos(a) * 18); s.rotation.y = a; }
  const iris = buildHatch(root, 1.2, false); iris.position.y = -1;
  // back-half walls
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4; if (Math.cos(a) > 0.1) continue;
    faceAt(root, a, R, 0, g => {
      const w = 2 * R * Math.tan(Math.PI / 8);
      B(g, 'chamber_wall', MAT.slate, -w / 2, w / 2, 0, Hc, -1.5, 0);
      for (let y = 0; y < Hc; y += 5) B(g, 'wall_panel', pick([MAT.slate, MAT.bone, MAT.hull]), -w / 2 + 0.3, w / 2 - 0.3, y + 0.2, y + 4.8, 0, 0.3 + rnd() * 0.4);
      B(g, 'wall_energy_lane', MAT.teal, -0.2, 0.2, 0, Hc, 0.7, 0.8);
      if (k % 2 === 0) { B(g, 'airlock_door', MAT.hull, -2.6, 2.6, 0, 5, 0.6, 0.9); B(g, 'airlock_frame', MAT.orange, -3.1, -2.6, 0, 5.5, 0.6, 1.0); B(g, 'airlock_frame', MAT.orange, 2.6, 3.1, 0, 5.5, 0.6, 1.0); B(g, 'airlock_frame', MAT.orange, -3.1, 3.1, 5, 5.5, 0.6, 1.0); B(g, 'airlock_status', MAT.teal, -0.4, 0.4, 5.8, 6.1, 0.6, 0.95); }
    });
  }
  // ceiling (back half) with shaft opening, shaft above
  bt.box('ceiling_slab', MAT.mass, -R / AP, R / AP, Hc, Hc + 3, -R / AP, -9.5); bt.box('ceiling_slab', MAT.mass, -R / AP, -9.5, Hc, Hc + 3, -9.5, 0); bt.box('ceiling_slab', MAT.mass, 9.5, R / AP, Hc, Hc + 3, -9.5, 0);
  octRing(root, 'shaft_mouth_ring', MAT.orange, 9.2, 0.4, Hc);
  shaftFrame(root, Hc + 30, Hc, 6);
  freightCab(root, -4.5, 9, 'arrived', Hc + 30 - 13.4);
  // control booth
  { const g = grp('control_booth', root, 0, 14, -R + 2); B(g, 'booth_floor', MAT.slate, -5, 5, 0, 0.5, -1, 4); B(g, 'booth_glass', MAT.glass, -5, 5, 0.5, 3.5, 3.9, 4); B(g, 'booth_roof', MAT.bone, -5.2, 5.2, 3.5, 4, -1, 4.2); B(g, 'booth_console', MAT.slate, -3, 3, 0.5, 1.4, 2.6, 3.4); B(g, 'booth_screens', MAT.display, -2.8, 2.8, 1.4, 2.1, 2.9, 3.0); B(g, 'booth_signal_edge', MAT.orange, -5.2, 5.2, 0.2, 0.5, 3.9, 4.2); person(g, -1, 0.5, 2, MAT.orange); }
  // jib crane
  { const g = grp('jib_crane', root, 15, 0, -10); C(g, 'jib_mast', MAT.bone, 1.4, 1.4, 22, 0.3, 0, 0, 0); B(g, 'jib_boom', MAT.orange, -12, 1, 21, 22.5, -0.6, 0.6); mesh(g, 'jib_cable', new THREE.CylinderGeometry(0.05, 0.05, 10, 6), MAT.hull, -9, 16, 0); B(g, 'jib_hook_block', MAT.slate, -9.6, -8.4, 10, 11.2, -0.6, 0.6); }
  // cargo pallets + crew
  for (const [x, z] of [[-12, -8], [-14, -4], [10, 4]]) { B(root, 'cargo_pallet', MAT.slate, x - 1.2, x + 1.2, 0, 0.2, z - 1, z + 1); B(root, 'cargo_crate', pick([MAT.bone, MAT.aged, MAT.blue]), x - 1, x + 1, 0.2, 1.8, z - 0.8, z + 0.8); }
  for (const [x, z] of [[-6, 8], [-7.5, 9], [12, -2], [-16, -12]]) person(root, x, 0, z, MAT.orange);
  // exterior below floor: clamps + craft
  const ext = buildHatch(root, 1.2, true); ext.position.y = -7; ext.children.filter(c => c.name.startsWith('iris_petal')).forEach(c => c.visible = false);
  bt.flush();
  return root;
}
