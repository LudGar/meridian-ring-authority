<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
let seed = 0x4d07;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const TAU = Math.PI * 2;
const Mt = (name, color, rough, metal, emissive, ei, opts = {}) => { const m = new THREE.MeshStandardMaterial({ name, color, roughness: rough, metalness: metal, ...opts }); if (emissive) { m.emissive = new THREE.Color(emissive); m.emissiveIntensity = ei ?? 1; } return m; };
const MAT = {
  bone: Mt('ceramic_bone', 0xd9d3c6, 0.55, 0.05), aged: Mt('ceramic_aged', 0xb3a68c, 0.8, 0.05),
  slate: Mt('panel_slate', 0x6b7279, 0.6, 0.25), hull: Mt('hull_graphite', 0x2b2f34, 0.72, 0.3), mass: Mt('structural_mass', 0x44484d, 0.8, 0.25),
  thermal: Mt('radiator_graphite', 0x3a3f45, 0.45, 0.35), orange: Mt('signal_orange', 0xe0612a, 0.5, 0.05), teal: Mt('energy_teal', 0x3fd0c0, 0.3, 0, 0x3fd0c0, 1.5),
  blue: Mt('water_service_blue', 0x3f6f9a, 0.45, 0.15), paver: Mt('paver_stone', 0xa49f94, 0.9, 0), concrete: Mt('concrete_civil', 0x8e8a83, 0.92, 0), deep: Mt('concrete_structural', 0x5b5953, 0.92, 0),
  soil: Mt('soil_substrate', 0x5a4a3a, 1, 0), grass: Mt('grass', 0x4f6b3c, 0.95, 0), foliage: Mt('foliage', 0x3d5a36, 0.9, 0), rock: Mt('terrain_ridge', 0x6d6658, 0.9, 0), asphalt: Mt('asphalt', 0x34373b, 0.95, 0),
  water: Mt('water', 0x2a4d6a, 0.12, 0.1, null, 0, { transparent: true, opacity: 0.55, depthWrite: false }),
  glass: Mt('glass', 0x7fa2ae, 0.1, 0.2, null, 0, { transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }),
  window: Mt('window_dark', 0x26343b, 0.15, 0.3), warm: Mt('light_warm', 0xf6e3b8, 0.5, 0, 0xf4cd88, 1.2), display: Mt('display_screen', 0xcfe9e4, 0.3, 0, 0x9fe3d8, 0.9),
  rubber: Mt('rubber_black', 0x1b1c1e, 0.9, 0), metal: Mt('bare_metal', 0x9aa0a6, 0.35, 0.85),
};
let root;
const grp = (name, parent = root, x = 0, y = 0, z = 0, ry = 0) => { const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g; };
const mesh = (p, name, geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.name = name; m.position.set(x, y, z); p.add(m); return m; };
const B = (p, name, mat, x0, x1, y0, y1, z0, z1) => mesh(p, name, new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)), mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
const cham = (w, d, h, c) => { const s = new THREE.Shape(), x = w / 2, z = d / 2; s.moveTo(-x + c, -z); s.lineTo(x - c, -z); s.lineTo(x, -z + c); s.lineTo(x, z - c); s.lineTo(x - c, z); s.lineTo(-x + c, z); s.lineTo(-x, z - c); s.lineTo(-x, -z + c); s.closePath(); const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false }); g.rotateX(-Math.PI / 2); return g; };
const C = (p, name, mat, w, d, h, c, x, y, z) => mesh(p, name, cham(w, d, h, c), mat, x, y, z);
const oct = (p, name, mat, rb, rt, y0, y1, x = 0, z = 0) => { const g = new THREE.CylinderGeometry(rt, rb, y1 - y0, 8); g.rotateY(Math.PI / 8); return mesh(p, name, g, mat, x, (y0 + y1) / 2, z); };
const cylX = (r, len, seg = 24) => new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2);
const cylZ = (r, len, seg = 24) => new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2);
const ring = (p, name, mat, r, tube, x, y, z, seg = 32) => mesh(p, name, new THREE.TorusGeometry(r, tube, 8, seg).rotateX(Math.PI / 2), mat, x, y, z);
const person = (p, x, y, z, mat = MAT.orange) => { const g = grp('figure_1.8m', p, x, y, z); mesh(g, 'figure_body', new THREE.CylinderGeometry(0.22, 0.2, 1.4, 8), mat, 0, 0.7, 0); mesh(g, 'figure_head', new THREE.SphereGeometry(0.15, 10, 8), MAT.bone, 0, 1.62, 0); return g; };
const glyph = (p, name, x, y, z, r = 0.6, ry = 0) => { const g = grp(name, p, x, y, z, ry); mesh(g, 'logo_ring', new THREE.TorusGeometry(r, r * 0.16, 6, 28), MAT.bone); B(g, 'logo_bar', MAT.orange, -r * 0.13, r * 0.13, -r * 1.16, r * 1.16, -0.03, 0.03); return g; };
const idPlate = (p, x, y, z, ry = 0) => { const g = grp('id_plate', p, x, y, z, ry); B(g, 'id_plate_graphite', MAT.hull, -0.9, 0.9, -0.3, 0.3, 0, 0.05); B(g, 'id_plate_signal', MAT.orange, -0.9, -0.75, -0.3, 0.3, 0.05, 0.06); return g; };
const rail = (p, name, x0, x1, y, z) => { B(p, name + '_top', MAT.bone, x0, x1, y + 1.0, y + 1.1, z - 0.04, z + 0.04); for (let x = x0; x <= x1 + 0.01; x += 2) B(p, name + '_post', MAT.slate, x - 0.04, x + 0.04, y, y + 1.1, z - 0.04, z + 0.04); };

// chamber shell: floor + back wall + left wall, front/right open
function chamber(name, L, D, H, wallMat = MAT.mass) {
  root = new THREE.Group(); root.name = name;
  B(root, 'chamber_floor', MAT.hull, -L, L, -2, 0, -D, D);

  for (let x = -L; x < L - 0.1; x += 10) for (let y = 0; y < H - 0.1; y += 10) { const m = pick([MAT.slate, MAT.slate, MAT.hull, MAT.bone]); B(root, 'wall_panel_' + m.name, m, x + 0.3, x + 9.7, y + 0.3, y + 9.7, -D, -D + 0.3 + rnd() * 0.8); }

  for (let x = -L + 20; x < L; x += 30) B(root, 'wall_energy_lane', MAT.teal, x - 0.4, x + 0.4, 0, H, -D + 1.2, -D + 1.4);
  B(root, 'wall_signal_band', MAT.orange, -L, L, 4, 4.4, -D + 1.2, -D + 1.4);
  B(root, 'ceiling_back', MAT.mass, -L - 3, L, H, H + 3, -D - 3, -D * 0.2);
  for (let x = -L + 5; x < L; x += 10) B(root, 'ceiling_beam', MAT.slate, x - 0.6, x + 0.6, H - 2, H, -D, -D * 0.2);
  for (let x = -L; x < L; x += 8) B(root, 'floor_grid_line', MAT.slate, x - 0.05, x + 0.05, 0, 0.02, -D, D);
  return root;
}

// ============ ENERGY CORE
function energy() {
  chamber('L6_energy_core_hall', 50, 35, 50);
  const g = grp('reactor_R1', root, 0, 0, -6);

  for (let k = 0; k < 4; k++) { const a = k * TAU / 4 + Math.PI / 4; const m = mesh(g, 'conduit_spoke', cylX(1.2, 18, 16), MAT.hull, Math.cos(a) * 9, 26, Math.sin(a) * 9); m.rotation.y = -a; }
  for (let k = 0; k < 4; k++) { const a = k * TAU / 4 + Math.PI / 4; mesh(g, 'conduit_riser', new THREE.CylinderGeometry(1.2, 1.2, 24, 16), MAT.hull, Math.cos(a) * 18, 24, Math.sin(a) * 18); for (let y = 15; y < 36; y += 6) mesh(g, 'riser_band', new THREE.CylinderGeometry(1.3, 1.3, 0.4, 16), MAT.teal, Math.cos(a) * 18, y, Math.sin(a) * 18); }

// ============ CENTRAL COMPUTING
function computing() {
  chamber('L6_central_computing_vault', 50, 35, 30, MAT.mass);
  B(root, 'raised_floor', MAT.slate, -50, 50, 0, 0.8, -35, 35);
  for (let x = -48; x < 50; x += 1.2) B(root, 'raised_floor_tile_seam', MAT.hull, x - 0.02, x + 0.02, 0.8, 0.81, -35, 35);

// ============ ATMOSPHERE PROCESSING

  mesh(root, 'main_air_duct', cylX(2.4, 100, 24), MAT.slate, 0, 31, -9);
  for (let x = -45; x <= 45; x += 10) mesh(root, 'duct_flange', cylX(2.6, 0.4, 24), MAT.hull, x, 31, -9);
  for (let i = 0; i < 3; i++) {
    const f = grp('axial_fan_' + (i + 1), root, -46.9, 14, -20 + i * 18);

    mesh(f, 'fan_lip', new THREE.TorusGeometry(6, 0.3, 8, 32).rotateY(Math.PI / 2), MAT.orange, 1, 0, 0);

    for (let k = 0; k < 8; k++) { const b = mesh(f, 'fan_blade', new THREE.BoxGeometry(0.15, 4.4, 1.2), MAT.hull, 0, Math.cos(k * TAU / 8) * 3.6, Math.sin(k * TAU / 8) * 3.6); b.rotation.x = k * TAU / 8; b.rotation.y = 0.4; }
  }
  for (let i = 0; i < 5; i++) { const g = grp('gas_bottle_rack', root, 20 + i * 5, 0, 22); for (let k = 0; k < 6; k++) mesh(g, 'gas_bottle', new THREE.CylinderGeometry(0.6, 0.6, 5, 16), [MAT.teal, MAT.blue, MAT.orange][i % 3], (k % 3) * 1.4 - 1.4, 2.5, Math.floor(k / 3) * 1.4 - 0.7); B(g, 'rack_frame', MAT.slate, -2.4, 2.4, 4.6, 4.9, -1.6, 1.6); }
  B(root, 'catwalk_vessels', MAT.slate, -50, 50, 22, 22.4, -6, -3); for (let x = -50; x <= 50; x += 2) B(root, 'catwalk_post', MAT.slate, x - 0.05, x + 0.05, 22.4, 23.5, -3.1, -3);
  B(root, 'catwalk_rail', MAT.bone, -50, 50, 23.4, 23.5, -3.1, -3);
  for (const [x, z, y] of [[-14, -4.5, 22.4], [10, -4.5, 22.4], [-30, 10, 0], [26, 18, 0]]) person(root, x, y, z);
  return root;
}

const LIST = [
  ['E', 'ENERGY CORE', energy, 'L6 · Energy core hall', 'Toroidal reactor ring with field coils, teal energy rings, a central column, conduit spokes and risers, a capacitor row along the wall, a glass control gallery and a polar crane. The hall is 50 m tall with a panelled shell.'],
  ['C', 'CENTRAL COMPUTING', computing, 'L6 · Central computing vault', 'Raised floor with rows of 18 m octagonal compute columns, with teal status lines and orange base bands. Coolant headers in service blue run overhead. In the middle is a circular control desk with screens around a teal core column.'],
  ['A', 'ATMOSPHERE PROCESSING', atmosphere, 'L6 · Atmosphere processing hall', 'Four 30 m scrubber vessels with platform rings, ladders and status bands, a main air duct, three wall-mounted axial fans and gas bottle racks coded teal/blue/orange.'],
];
const VIEWS = [
  { tag: 'ALL', label: 'LINEUP', title: 'Layer 06 · Core systems', text: 'The critical systems at the bottom of the ring, just above the hull: energy, central computing and atmosphere processing. Each is shown as a cut-open chamber with the same panelled shell, teal energy lanes and orange signal band used in the L4/L5 cavern.', fn: () => { const g = new THREE.Group(); g.name = 'MRA_L6_core_lineup'; let x = 0; for (const [, , fn] of LIST) { const o = fn(); const bb = new THREE.Box3().setFromObject(o); o.position.x = x - bb.min.x; x += bb.max.x - bb.min.x + 15; g.add(o); } return g; } },
  ...LIST.map(([tag, label, fn, title, text]) => ({ tag, label, fn, title, text })),
];
const cache = {}, nav = document.getElementById('levels'), note = document.getElementById('note');
VIEWS.forEach((v, i) => { const b = document.createElement('button'); b.innerHTML = `<span>${v.tag}</span><span>${v.label}</span>`; b.onclick = () => show(i); nav.appendChild(b); });
function show(i) { const v = VIEWS[i]; cache[i] ??= v.fn(); stage.setAttribute('name', 'MRA-01_' + cache[i].name); stage.setObject(cache[i]); [...nav.children].forEach((b, j) => b.setAttribute('aria-pressed', j === i)); note.innerHTML = `<b>${v.title}</b>${v.text}`; localStorage.setItem('mra_core_view', i); }
show(Math.min(+localStorage.getItem('mra_core_view') || 0, VIEWS.length - 1));
