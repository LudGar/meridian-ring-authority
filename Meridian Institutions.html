<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
let seed = 0x4d07;

const pick = a => a[Math.floor(rnd() * a.length)];
const TAU = Math.PI * 2;
const Mt = (name, color, rough, metal, emissive, ei, opts = {}) => { const m = new THREE.MeshStandardMaterial({ name, color, roughness: rough, metalness: metal, ...opts }); if (emissive) { m.emissive = new THREE.Color(emissive); m.emissiveIntensity = ei ?? 1; } return m; };
const MAT = {
  bone: Mt('ceramic_bone', 0xd9d3c6, 0.55, 0.05), aged: Mt('ceramic_aged', 0xb3a68c, 0.8, 0.05),
  slate: Mt('panel_slate', 0x6b7279, 0.6, 0.25), hull: Mt('hull_graphite', 0x2b2f34, 0.72, 0.3), mass: Mt('structural_mass', 0x44484d, 0.8, 0.25),
  thermal: Mt('radiator_graphite', 0x3a3f45, 0.45, 0.35), orange: Mt('signal_orange', 0xe0612a, 0.5, 0.05), teal: Mt('energy_teal', 0x3fd0c0, 0.3, 0, 0x3fd0c0, 1.5),
  blue: Mt('water_service_blue', 0x3f6f9a, 0.45, 0.15), paver: Mt('paver_stone', 0xa49f94, 0.9, 0), concrete: Mt('concrete_civil', 0x8e8a83, 0.92, 0), deep: Mt('concrete_structural', 0x5b5953, 0.92, 0),
  soil: Mt('soil_substrate', 0x5a4a3a, 1, 0), grass: Mt('grass', 0x4f6b3c, 0.95, 0), foliage: Mt('foliage', 0x3d5a36, 0.9, 0), rock: Mt('terrain_ridge', 0x6d6658, 0.9, 0), asphalt: Mt('asphalt', 0x34373b, 0.95, 0),
  water: Mt('water', 0x2a4d6a, 0.12, 0.1, null, 0, { transparent: true, opacity: 0.55, depthWrite: false }),
  glass: Mt('glass', 0x7fa2ae, 0.1, 0.2, null, 0, { transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }),
  window: Mt('window_dark', 0x26343b, 0.15, 0.3), warm: Mt('light_warm', 0xf6e3b8, 0.5, 0, 0xf4cd88, 1.2), display: Mt('display_screen', 0xcfe9e4, 0.3, 0, 0x9fe3d8, 0.9),
  rubber: Mt('rubber_black', 0x1b1c1e, 0.9, 0), metal: Mt('bare_metal', 0x9aa0a6, 0.35, 0.85),

let root;
const grp = (name, parent = root, x = 0, y = 0, z = 0, ry = 0) => { const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g; };
const mesh = (p, name, geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.name = name; m.position.set(x, y, z); p.add(m); return m; };
const B = (p, name, mat, x0, x1, y0, y1, z0, z1) => mesh(p, name, new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)), mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
const cham = (w, d, h, c) => { const s = new THREE.Shape(), x = w / 2, z = d / 2; s.moveTo(-x + c, -z); s.lineTo(x - c, -z); s.lineTo(x, -z + c); s.lineTo(x, z - c); s.lineTo(x - c, z); s.lineTo(-x + c, z); s.lineTo(-x, z - c); s.lineTo(-x, -z + c); s.closePath(); const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false }); g.rotateX(-Math.PI / 2); return g; };
const C = (p, name, mat, w, d, h, c, x, y, z) => mesh(p, name, cham(w, d, h, c), mat, x, y, z);
const oct = (p, name, mat, rb, rt, y0, y1, x = 0, z = 0) => { const g = new THREE.CylinderGeometry(rt, rb, y1 - y0, 8); g.rotateY(Math.PI / 8); return mesh(p, name, g, mat, x, (y0 + y1) / 2, z); };
const cylX = (r, len, seg = 24) => new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2);
const cylZ = (r, len, seg = 24) => new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2);
const ring = (p, name, mat, r, tube, x, y, z, seg = 32) => mesh(p, name, new THREE.TorusGeometry(r, tube, 8, seg).rotateX(Math.PI / 2), mat, x, y, z);
const person = (p, x, y, z, mat = MAT.orange) => { const g = grp('figure_1.8m', p, x, y, z); mesh(g, 'figure_body', new THREE.CylinderGeometry(0.22, 0.2, 1.4, 8), mat, 0, 0.7, 0); mesh(g, 'figure_head', new THREE.SphereGeometry(0.15, 10, 8), MAT.bone, 0, 1.62, 0); return g; };
const glyph = (p, name, x, y, z, r = 0.6, ry = 0) => { const g = grp(name, p, x, y, z, ry); mesh(g, 'logo_ring', new THREE.TorusGeometry(r, r * 0.16, 6, 28), MAT.bone); B(g, 'logo_bar', MAT.orange, -r * 0.13, r * 0.13, -r * 1.16, r * 1.16, -0.03, 0.03); return g; };
const idPlate = (p, x, y, z, ry = 0) => { const g = grp('id_plate', p, x, y, z, ry); B(g, 'id_plate_graphite', MAT.hull, -0.9, 0.9, -0.3, 0.3, 0, 0.05); B(g, 'id_plate_signal', MAT.orange, -0.9, -0.75, -0.3, 0.3, 0.05, 0.06); return g; };
const rail = (p, name, x0, x1, y, z) => { B(p, name + '_top', MAT.bone, x0, x1, y + 1.0, y + 1.1, z - 0.04, z + 0.04); for (let x = x0; x <= x1 + 0.01; x += 2) B(p, name + '_post', MAT.slate, x - 0.04, x + 0.04, y, y + 1.1, z - 0.04, z + 0.04); };
const tree = (p, x, z, s = 1) => { const g = grp('tree', p, x, 0, z); mesh(g, 'tree_trunk', new THREE.CylinderGeometry(0.15 * s, 0.22 * s, 3 * s, 8), MAT.slate.clone ? MAT.soil : MAT.soil, 0, 1.5 * s, 0); mesh(g, 'tree_crown', new THREE.SphereGeometry(2 * s, 12, 9), MAT.foliage, 0, 4 * s, 0).scale.y = 1.2; };

const forest = (p, x0, x1, z0, z1, n, avoid) => { for (let i = 0; i < n; i++) { const x = x0 + rnd() * (x1 - x0), z = z0 + rnd() * (z1 - z0); if (avoid && avoid(x, z)) continue; const s = 0.8 + rnd() * 0.8; mesh(p, 'forest_trunk', new THREE.CylinderGeometry(0.2 * s, 0.3 * s, 4 * s, 6), MAT.soil, x, 2 * s, z); mesh(p, 'forest_crown', new THREE.ConeGeometry(2.2 * s, 7 * s, 7), MAT.foliage, x, 6.5 * s, z); } };
const block = (p, x, z, w, d, floors, opts = {}) => { const g = grp(opts.name || 'banded_block', p, x, 0, z); const FH = opts.fh || 3.4; C(g, 'plinth', opts.plinth || MAT.concrete, w, d, 1, Math.min(w, d) * 0.08, 0, 0, 0); for (let f = 0; f < floors; f++) { C(g, 'glazing', (f === 0 || rnd() < 0.15) ? MAT.warm : MAT.window, w - 0.6, d - 0.6, FH - 0.8, Math.min(w, d) * 0.07, 0, 1 + f * FH, 0); C(g, 'slab_band', opts.mat || MAT.bone, w, d, 0.8, Math.min(w, d) * 0.08, 0, 1 + f * FH + FH - 0.8, 0); } const top = 1 + floors * FH; if (opts.drum !== false) mesh(g, 'roof_drum', cylX(Math.min(d, 6) * 0.22, w * 0.6, 16), MAT.slate, 0, top + Math.min(d, 6) * 0.22, 0); if (opts.teal) B(g, 'roof_teal_edge', MAT.teal, -w / 2, w / 2, top, top + 0.15, d / 2 - 0.1, d / 2); return g; };
const road = (p, x0, x1, z0, z1) => { B(p, 'road', MAT.asphalt, x0, x1, 0, 0.06, z0, z1); const alongX = (x1 - x0) > (z1 - z0); if (alongX) { const zc = (z0 + z1) / 2; for (let x = x0; x < x1; x += 8) B(p, 'lane_dash', MAT.bone, x, x + 4, 0.06, 0.07, zc - 0.1, zc + 0.1); B(p, 'service_lane_edge', MAT.orange, x0, x1, 0.06, 0.07, z0 + 1.6, z0 + 1.8); } else { const xc = (x0 + x1) / 2; for (let z = z0; z < z1; z += 8) B(p, 'lane_dash', MAT.bone, xc - 0.1, xc + 0.1, 0.06, 0.07, z, z + 4); B(p, 'service_lane_edge', MAT.orange, x0 + 1.6, x0 + 1.8, 0.06, 0.07, z0, z1); } };
const lampRow = (p, x0, x1, z, step = 16) => { for (let x = x0; x <= x1; x += step) { const g = grp('street_lamp', p, x, 0, z); B(g, 'lamp_post', MAT.slate, -0.12, 0.12, 0, 7.5, -0.12, 0.12); B(g, 'lamp_arm', MAT.bone, -0.1, 0.1, 7.4, 7.6, -0.1, z > 0 ? -2 : 2); B(g, 'lamp_emitter', MAT.warm, -0.15, 0.15, 7.3, 7.4, z > 0 ? -2 : 1.4, z > 0 ? -1.4 : 2); B(g, 'lamp_energy_ring', MAT.teal, -0.2, 0.2, 0.4, 0.5, -0.2, 0.2); } };
const tram = (p, x, z, len = 28, ry = 0) => { const g = grp('tram', p, x, 0.3, z, ry); C(g, 'tram_body', MAT.bone, len, 2.8, 3.4, 0.7, 0, 0.3, 0); B(g, 'tram_windows', MAT.window, -len / 2 + 1, len / 2 - 1, 1.8, 3.1, -1.42, 1.42); B(g, 'tram_energy_line', MAT.teal, -len / 2, len / 2, 1.5, 1.62, -1.43, 1.43); B(g, 'tram_nose', MAT.orange, len / 2 - 0.2, len / 2 + 0.05, 0.4, 3.6, -1, 1); return g; };



// ============ INSTITUTIONS (research campus, defence garrison, council quarter)
const XM = { red: Mt('light_red', 0xff3a2e, 0.3, 0, 0xff3a2e, 2) };
const TX = (lines, w, h, o = {}) => { const ppm = o.ppm || 120, cv = document.createElement('canvas'); cv.width = Math.round(w * ppm); cv.height = Math.round(h * ppm); const c = cv.getContext('2d'); c.fillStyle = o.fg || '#ece7dc'; c.textBaseline = 'middle'; c.textAlign = 'center'; const fs = (o.size || h * 0.6 / lines.length) * ppm; c.font = '700 ' + fs + "px 'IBM Plex Sans Condensed', sans-serif"; lines.forEach((t, i) => c.fillText(t, cv.width / 2, cv.height / 2 + (i - (lines.length - 1) / 2) * fs * 1.12 + fs * 0.04, cv.width - 0.1 * ppm)); const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; return new THREE.MeshStandardMaterial({ name: 'legend_' + lines.join('_').toLowerCase().replace(/[^a-z0-9]+/g, '_'), map: tex, transparent: true, alphaTest: 0.35, roughness: 0.55 }); };
const legend = (p, lines, w, h, x, y, z, o = {}, geoFn) => { const m = TX(lines, w, h, o), g = new THREE.PlaneGeometry(o.gw || w, o.gh || h); if (geoFn) geoFn(g); return mesh(p, m.name, g, m, x, y, z); };
const flatText = (p, lines, x, z, ry, y, gw, gh) => { const g = grp('surface_legend', p, x, 0, z, ry); legend(g, lines, gw, gh / 2, 0, y, 0, { ppm: 60, size: gh / 2 * 0.8, gw, gh }, geo => geo.rotateX(-Math.PI / 2).rotateY(-Math.PI / 2)); };
const panel = (p, lines, x, y, z, w, h, o = {}) => { const g = grp('sign_' + lines[0].toLowerCase().replace(/[^a-z0-9]+/g, '_'), p, x, y, z, o.ry || 0); B(g, 'sign_panel', o.mat || MAT.hull, -w / 2, w / 2, -h / 2, h / 2, 0, 0.08); if (o.bar) B(g, 'sign_bar', o.bar, -w / 2, -w / 2 + Math.min(0.3, h * 0.18), -h / 2, h / 2, 0.08, 0.1); legend(g, lines, w - 0.5, h * 0.9, 0.15, 0, 0.1, { size: o.size, fg: o.fg }); return g; };
const ribbons = (p, x0, x1, z, y0, floors, fh, step = 3) => { for (let f = 0; f < floors; f++) { const y = y0 + f * fh; B(p, 'window_ribbon', MAT.window, x0, x1, y + 1.0, y + 2.8, z - 0.03, z + 0.03); for (let x = x0; x <= x1 + 0.01; x += step) B(p, 'mullion', MAT.slate, x - 0.06, x + 0.06, y + 1.0, y + 2.8, z - 0.05, z + 0.05); } };
const monument = (p, x, y, z, lines, w = 16) => { const m = grp('monument_sign', p, x, y, z); C(m, 'monument_wall', MAT.bone, w, 0.8, 2.2, 0.2, 0, 0, 0); B(m, 'monument_band', MAT.orange, -w / 2, w / 2, 2.2, 2.35, -0.4, 0.4); legend(m, lines, w - 3.2, 1.7, 1.2, 1.1, 0.42, { size: 0.55, fg: '#1e2125' }); glyph(m, 'logo', -w / 2 + 1.3, 1.1, 0.45, 0.6); };
const fence = (p, ax, a0, a1, c, h, gaps = []) => { const inGap = a => gaps.some(([g0, g1]) => a > g0 - 0.01 && a < g1 + 0.01); const P = (u, v, y0, y1, w, mat, name) => ax === 'x' ? B(p, name, mat, u, v, y0, y1, c - w, c + w) : B(p, name, mat, c - w, c + w, y0, y1, u, v);

const watch = (p, x, z) => { const g = grp('watch_tower', p, x, 0, z); for (const sx of [-1.4, 1.4]) for (const sz of [-1.4, 1.4]) B(g, 'watch_tower_leg', MAT.slate, sx - 0.12, sx + 0.12, 0, 9, sz - 0.12, sz + 0.12); C(g, 'watch_cab', MAT.hull, 3.6, 3.6, 2.6, 0.5, 0, 9, 0); B(g, 'watch_cab_glazing', MAT.window, -1.5, 1.5, 10, 11, -1.82, 1.82); B(g, 'watch_cab_glazing', MAT.window, -1.82, 1.82, 10, 11, -1.5, 1.5); B(g, 'watch_cab_band', MAT.orange, -1.3, 1.3, 9.2, 9.6, -1.81, 1.81); C(g, 'watch_roof', MAT.bone, 4.2, 4.2, 0.4, 0.6, 0, 11.6, 0); B(g, 'searchlight', MAT.warm, -0.3, 0.3, 12, 12.4, -0.3, 0.3); };

const bench = (p, x, y, z, ry = 0) => { const g = grp('bench', p, x, y, z, ry); B(g, 'bench_seat', MAT.bone, -1, 1, 0.42, 0.5, -0.25, 0.25); for (const s of [-0.8, 0.8]) B(g, 'bench_leg', MAT.slate, s - 0.06, s + 0.06, 0, 0.42, -0.2, 0.2); };
const people = (p, pts, y = 0.1) => pts.forEach(([x, z], i) => person(p, x, y, z, [MAT.orange, MAT.blue, MAT.slate, MAT.hull][i % 4]));

// ---------------- R-01 research campus
function research(p) {

    ribbons(p, -63, -17, z + 8, 0.9, 3, 3.7, 2.5); ribbons(p, -63, -17, z - 8, 0.9, 3, 3.7, 2.5);
    for (let f = 1; f < 3; f++) B(p, 'floor_band', MAT.slate, -64.6, -15.4, 0.9 + f * 3.7 - 0.1, 0.9 + f * 3.7 + 0.1, z + 7.96, z + 8.04);
    B(p, 'roof_crown', MAT.orange, -64.6, -15.4, 12.4, 12.9, z + 7.96, z + 8.04); C(p, 'roof_plant_room', MAT.slate, 14, 8, 3, 0.4, -30, 12.9, z);
