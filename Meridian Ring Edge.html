<style>
  html,body{margin:0;height:100%;background:#16191d;color:#d9d3c6;overflow:hidden}
  a{color:#e0612a;pointer-events:auto} a:hover{color:#f08a58}
  three-d-stage:not(:defined){visibility:hidden}
  .tb{position:fixed;left:20px;top:20px;pointer-events:none;display:flex;flex-direction:column;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em}

<body>
<three-d-stage name="MRA-01_ring_edge" background="#16191d" autorotate></three-d-stage>
<div class="tb">
  <div class="mark"><div class="glyph"></div><h1>MERIDIAN · RING EDGE &amp; PANELS</h1></div>
  <div>SCENE B · PANEL SYSTEM P-01…P-05 · DESIGN BIBLE CH. 03–04</div>
  <div class="muted">SCALE 1:1 · <a href="Meridian Design Bible v2.dc.html">DESIGN BIBLE</a> · <a href="Meridian Core Systems.html">CORE SYSTEMS</a> · <a href="Meridian Access Spire v2.html">SPIRE</a> · <a href="Meridian Wall Standard.html">WALL STANDARD WK-1 R2</a></div>
</div>

<div class="note" id="note"></div>

<script src="three-d-stage.js"></script>
<script type="module">
import { wallKit } from './meridian-wall-kit.js';
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
let seed = 0x4d07;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rnd() * a.length)];
const TAU = Math.PI * 2;
const Mt = (name, color, rough, metal, emissive, ei, opts = {}) => { const m = new THREE.MeshStandardMaterial({ name, color, roughness: rough, metalness: metal, ...opts }); if (emissive) { m.emissive = new THREE.Color(emissive); m.emissiveIntensity = ei ?? 1; } return m; };
const MAT = {
  bone: Mt('ceramic_bone', 0xd9d3c6, 0.55, 0.05), aged: Mt('ceramic_aged', 0xb3a68c, 0.8, 0.05),
  slate: Mt('panel_slate', 0x6b7279, 0.6, 0.25), hull: Mt('hull_graphite', 0x2b2f34, 0.72, 0.3), mass: Mt('structural_mass', 0x44484d, 0.8, 0.25),
  thermal: Mt('radiator_graphite', 0x3a3f45, 0.45, 0.35), orange: Mt('signal_orange', 0xe0612a, 0.5, 0.05), teal: Mt('energy_teal', 0x3fd0c0, 0.3, 0, 0x3fd0c0, 1.5),
  blue: Mt('water_service_blue', 0x3f6f9a, 0.45, 0.15), paver: Mt('paver_stone', 0xa49f94, 0.9, 0), concrete: Mt('concrete_civil', 0x8e8a83, 0.92, 0), deep: Mt('concrete_structural', 0x5b5953, 0.92, 0),
  soil: Mt('soil_substrate', 0x5a4a3a, 1, 0), grass: Mt('grass', 0x4f6b3c, 0.95, 0), foliage: Mt('foliage', 0x3d5a36, 0.9, 0), rock: Mt('terrain_ridge', 0x6d6658, 0.9, 0), asphalt: Mt('asphalt', 0x34373b, 0.95, 0),
  water: Mt('water', 0x2a4d6a, 0.12, 0.1, null, 0, { transparent: true, opacity: 0.55, depthWrite: false }),
  glass: Mt('glass', 0x7fa2ae, 0.1, 0.2, null, 0, { transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }),
  window: Mt('window_dark', 0x26343b, 0.15, 0.3), warm: Mt('light_warm', 0xf6e3b8, 0.5, 0, 0xf4cd88, 1.2), display: Mt('display_screen', 0xcfe9e4, 0.3, 0, 0x9fe3d8, 0.9),
  rubber: Mt('rubber_black', 0x1b1c1e, 0.9, 0), metal: Mt('bare_metal', 0x9aa0a6, 0.35, 0.85),
};
let root;
const grp = (name, parent = root, x = 0, y = 0, z = 0, ry = 0) => { const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); g.rotation.y = ry; parent.add(g); return g; };
const mesh = (p, name, geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.name = name; m.position.set(x, y, z); p.add(m); return m; };
const B = (p, name, mat, x0, x1, y0, y1, z0, z1) => mesh(p, name, new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)), mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
const cham = (w, d, h, c) => { const s = new THREE.Shape(), x = w / 2, z = d / 2; s.moveTo(-x + c, -z); s.lineTo(x - c, -z); s.lineTo(x, -z + c); s.lineTo(x, z - c); s.lineTo(x - c, z); s.lineTo(-x + c, z); s.lineTo(-x, z - c); s.lineTo(-x, -z + c); s.closePath(); const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false }); g.rotateX(-Math.PI / 2); return g; };
const C = (p, name, mat, w, d, h, c, x, y, z) => mesh(p, name, cham(w, d, h, c), mat, x, y, z);
const oct = (p, name, mat, rb, rt, y0, y1, x = 0, z = 0) => { const g = new THREE.CylinderGeometry(rt, rb, y1 - y0, 8); g.rotateY(Math.PI / 8); return mesh(p, name, g, mat, x, (y0 + y1) / 2, z); };
const cylX = (r, len, seg = 24) => new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2);
const cylZ = (r, len, seg = 24) => new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2);
const ring = (p, name, mat, r, tube, x, y, z, seg = 32) => mesh(p, name, new THREE.TorusGeometry(r, tube, 8, seg).rotateX(Math.PI / 2), mat, x, y, z);
const person = (p, x, y, z, mat = MAT.orange) => { const g = grp('figure_1.8m', p, x, y, z); mesh(g, 'figure_body', new THREE.CylinderGeometry(0.22, 0.2, 1.4, 8), mat, 0, 0.7, 0); mesh(g, 'figure_head', new THREE.SphereGeometry(0.15, 10, 8), MAT.bone, 0, 1.62, 0); return g; };
const glyph = (p, name, x, y, z, r = 0.6, ry = 0) => { const g = grp(name, p, x, y, z, ry); mesh(g, 'logo_ring', new THREE.TorusGeometry(r, r * 0.16, 6, 28), MAT.bone); B(g, 'logo_bar', MAT.orange, -r * 0.13, r * 0.13, -r * 1.16, r * 1.16, -0.03, 0.03); return g; };
const idPlate = (p, x, y, z, ry = 0) => { const g = grp('id_plate', p, x, y, z, ry); B(g, 'id_plate_graphite', MAT.hull, -0.9, 0.9, -0.3, 0.3, 0, 0.05); B(g, 'id_plate_signal', MAT.orange, -0.9, -0.75, -0.3, 0.3, 0.05, 0.06); return g; };
const rail = (p, name, x0, x1, y, z) => { B(p, name + '_top', MAT.bone, x0, x1, y + 1.0, y + 1.1, z - 0.04, z + 0.04); for (let x = x0; x <= x1 + 0.01; x += 2) B(p, name + '_post', MAT.slate, x - 0.04, x + 0.04, y, y + 1.1, z - 0.04, z + 0.04); };
const tree = (p, x, z, s = 1) => { const g = grp('tree', p, x, 0, z); mesh(g, 'tree_trunk', new THREE.CylinderGeometry(0.15 * s, 0.22 * s, 3 * s, 8), MAT.slate.clone ? MAT.soil : MAT.soil, 0, 1.5 * s, 0); mesh(g, 'tree_crown', new THREE.SphereGeometry(2 * s, 12, 9), MAT.foliage, 0, 4 * s, 0).scale.y = 1.2; };


// ============ PANEL KIT — from the shared wall standard WK-1 (meridian-wall-kit.js)
const K = wallKit(THREE, MAT, rnd);
const { P01, P01A: P01aged, P01X: P01dead, P02, P03, P04, P05 } = K.PANEL;
const PANELS = [['P-01', 'STRUCTURAL', P01, 'Bone ceramic, 4 corner fasteners, 45° chamfer, light reveal on the top edge. Carries load; serviced from behind only.'], ['P-02', 'ENERGY', P02, 'Slate face, teal strip in a graphite housing, three conduit sockets, lock plate. Locked front access.'], ['P-03', 'THERMAL', P03, 'Graphite with 12 vertical cooling fins between a header and a footer, coolant inlet. Fins swap individually.'], ['P-04', 'UTILITY', P04, 'Slate with vent slots, a hinged tool-key door, three gauges (water, energy, air) and a data port row.'], ['P-05', 'ACCESS', P05, 'Orange vertical mark, hatch door with an orange handle, teal status light, step plate. This panel is the access.'], ['P-01A', 'AGED / REPAIR', P01aged, 'Repair generation: yellowed ceramic, hairline cracks, a stain and a riveted patch from a newer panel.'], ['P-01X', 'DECOMMISSIONED', P01dead, 'Taken out of service: graphite face with an orange cross.']];

// ============ RING EDGE DIORAMA (Scene B) — built from WK-1 pieces
function ringEdge() {
  root = new THREE.Group(); root.name = 'scene_B_ring_edge';
  const W = 240, put = (p, x = 0, y = 0, z = 0) => { p.position.set(x, y, z); root.add(p); return p; };
  const Y = K.SPEC.rim.footY, agri = Mt('terrain_agri', 0x8c8a4c, 0.95, 0);
  // WK-1 R2: T8 against the wall, T7 140 m below; the edge transition seen from the wall foot
  put(K.terrace('T8', { w: W, trees: [700, 1900] }), 0, 0, 0);
  put(K.terrace('T7', { w: W, lod: 1 }), 0, 0, 2000);
  for (let i = 0; i < 8; i++) B(root, 'T7_field_strip', i % 2 ? MAT.paver : agri, 0, W, 980, 980.1, 2300 + i * 200, 2400 + i * 200);
  B(root, 'T8_transit_track', MAT.hull, 0, W, Y, Y + 0.4, 400, 408); B(root, 'T8_transit_energy_rail', MAT.teal, 0, W, Y + 0.4, Y + 0.6, 407.6, 407.9);
  for (let x = 20; x <= 220; x += 40) { const g = grp('rim_maintenance_tower_M01', root, x, Y, 40); C(g, 'tower_plinth', MAT.aged, 7, 7, 3.5, 1.2, 0, 0, 0); C(g, 'tower_shaft', MAT.bone, 5, 5, 22, 0.9, 0, 3.5, 0); C(g, 'tower_crown', MAT.orange, 5.3, 5.3, 1.2, 0.95, 0, 25.5, 0); mesh(g, 'tower_beacon', new THREE.SphereGeometry(0.4, 10, 8), MAT.teal, 0, 27.3, 0); }
  person(root, 120, Y, 70, MAT.slate);
  // WK-1 R2 rim wall: root, foot +1 120 with doors, ten storeys, ledge 1 at +2 100, buttresses, break (continues to +25 000)
  B(root, 'rim_wall_root', MAT.mass, 0, W, -9, Y, -60, 0);
  put(K.rimFoot({ w: W, doors: [70, 170] }), 0, Y, 0);
  for (let k = 0; k < 10; k++) put(K.rimStorey({ w: W, lod: k < 5 ? 1 : 2, lanes: [50, 150], thermalRows: k === 3 ? [0, 1, 2, 3] : [], mat: (ix, r) => { const x = ix * 20, y = 100 * k + 20 * r; if (x >= 140 && x < 200 && y >= 100 && y < 200) return MAT.aged; if (x >= 40 && x < 80 && y >= 260 && y < 320) return MAT.hull; const q = rnd(); return q < 0.1 ? MAT.aged : q < 0.25 ? MAT.slate : MAT.bone; } }), 0, Y + 80 + 100 * k, 0);
  K.closeFrame(root, 0, W, Y + 20, Y + 1080);
  put(K.ledge({ w: W, lights: [200] }), 0, K.SPEC.rim.ledges.first, 0);
  for (const x of [0, 100, 200]) for (const [t, y0, h] of [['A', Y, 200], ['B', Y + 200, 200], ['C', Y + 400, 680]]) put(K.buttress(t, h), x + 20, y0, 0);
  mesh(root, 'break_continues_to_25km', K.profile([[0, Y + 1080], [60, Y + 1080], [60, Y + 1100], [48, Y + 1125], [36, Y + 1098], [24, Y + 1130], [12, Y + 1104], [0, Y + 1120]], W), MAT.mass);
  { const g = grp('wall_crawler', root, 100, Y + 260, 3); C(g, 'crawler_body', MAT.orange, 4, 3, 2.4, 0.4, 0, 0, 0); B(g, 'crawler_beacon', MAT.teal, -0.4, 0.4, 2.4, 2.8, -0.4, 0.4); }
  return root;
}
const LIST = [];
const VIEWS = [
  { tag: 'B', label: 'RING EDGE SCENE', title: 'Scene B · Ring edge', text: 'Built from wall standard WK-1 R2. From the wall foot: the T8 tread at +1 120 m runs 2 km out to its 140 m face, with T7 and its fields below. A row of M-01 towers and a transit track sit on T8 in front of the rim wall. The wall rises in 20 m bays of 4 m panels: mixed panel types, a repaired zone, a decommissioned patch, the P-03 thermal band, buttresses every 100 m, teal lanes, two vehicle doors in the 20 m plinth, and service ledge 1 at +2 100 m. Only the first kilometre is shown; the break marks where it continues to the crest at +25 km.', fn: ringEdge },
  { tag: 'ALL', label: 'PANEL KIT', title: 'Panel system · P-01 … P-05', text: 'The 4 m module at true scale, with a 1.8 m figure. Shared grammar: a 45° chamfer, shadow-gap frame, light reveal on the top edge, four corner fasteners and an ID stencil top-left. Function is shown by colour and relief.', fn: () => { const g = new THREE.Group(); g.name = 'MRA_panel_kit'; root = g; PANELS.forEach(([, , fn], i) => { const p = fn(); p.position.x = i * 4.8; g.add(p); }); person(g, -2, 0, 1.2, MAT.orange); return g; } },
  ...PANELS.map(([tag, label, fn, text]) => ({ tag, label, title: tag + ' · ' + label, text, fn: () => { const p = fn(); root = p; person(p, 4.8, 0, 1, MAT.orange); return p; } })),
];
const cache = {}, nav = document.getElementById('levels'), note = document.getElementById('note');
VIEWS.forEach((v, i) => { const b = document.createElement('button'); b.innerHTML = `<span>${v.tag}</span><span>${v.label}</span>`; b.onclick = () => show(i); nav.appendChild(b); });
function show(i) { const v = VIEWS[i]; cache[i] ??= v.fn(); stage.setAttribute('name', 'MRA-01_' + cache[i].name); stage.setObject(cache[i]); [...nav.children].forEach((b, j) => b.setAttribute('aria-pressed', j === i)); note.innerHTML = `<b>${v.title}</b>${v.text}`; localStorage.setItem('mra_edge_view', i); }
show(Math.min(+localStorage.getItem('mra_edge_view') || 0, VIEWS.length - 1));
</script>
